<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>影子一擊 (One-Hit Samurai) - QR Code 雙人連線版</title>
    <!-- Phaser 3 Engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- PeerJS WebRTC Connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0e15;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            border: 4px solid #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        /* Mobile Touch Controls Overlay */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
            z-index: 10;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .action-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            background: rgba(15, 23, 42, 0.7);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .action-btn:active {
            transform: scale(0.92);
            background: rgba(59, 130, 246, 0.8);
        }
        .btn-shot { border-color: #ef4444; color: #fca5a5; }
        .btn-dodge { border-color: #3b82f6; color: #93c5fd; }

        /* QR Code Modal overlay */
        #qr-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 14, 21, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #qrcode-box {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Touch Controls for Mobile/Web -->
        <div class="touch-controls" id="touch-controls" style="display: none;">
            <div class="btn-group" id="p1-touch">
                <div class="action-btn btn-shot" id="btn-p1-shot">開槍</div>
                <div class="action-btn btn-dodge" id="btn-p1-dodge">閃躲</div>
            </div>
            <div class="btn-group" id="p2-touch" style="display: none;">
                <div class="action-btn btn-shot" id="btn-p2-shot">開槍</div>
                <div class="action-btn btn-dodge" id="btn-p2-dodge">閃躲</div>
            </div>
        </div>

        <!-- QR Code Connection Overlay -->
        <div id="qr-modal">
            <h2 style="color: #60a5fa; font-size: 24px;">雙人 QR Code 掃碼對決</h2>
            <p style="margin-top: 8px; color: #94a3b8;">請使用另一支手機掃描 QR Code 加入房間：</p>
            <div id="qrcode-box"></div>
            <p id="room-id-label" style="margin-top: 15px; font-weight: bold; color: #f59e0b;">房號生成中...</p>
            <button id="btn-close-qr" style="margin-top: 20px; padding: 8px 20px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">取消連線</button>
        </div>
    </div>

<script>
// ==========================================
// 1. CHARACTER DATA SCHEMA (8 CHARACTERS)
// ==========================================
const CHARACTER_SCHEMA = {
  bounds: {
    hp: { min: 50, max: 200, scaleMin: 0.8, scaleMax: 1.6 },
    attack: { min: 20, max: 100, scaleMin: 0.7, scaleMax: 1.7 },
    speed: { min: 150, max: 750, haloMin: 1, haloMax: 5 }
  },
  list: [
    { id: "ronin_zero", name: "浪人 · 零", color: 0xef4444, stats: { hp: 100, attack: 50, bulletSpeed: 400 } },
    { id: "heavy_golem", name: "巨石武士", color: 0xd97706, stats: { hp: 200, attack: 85, bulletSpeed: 200 } },
    { id: "shadow_blade", name: "影襲者", color: 0x8b5cf6, stats: { hp: 60, attack: 40, bulletSpeed: 700 } },
    { id: "crimson_sniper", name: "紅蓮客", color: 0xd97706, stats: { hp: 80, attack: 95, bulletSpeed: 550 } },
    { id: "cyber_samurai", name: "賽博浪人", color: 0x06b6d4, stats: { hp: 110, attack: 65, bulletSpeed: 450 } },
    { id: "ghost_walker", name: "幽冥鬼劍", color: 0x10b981, stats: { hp: 70, attack: 30, bulletSpeed: 750 } },
    { id: "iron_monk", name: "鐵膽僧人", color: 0xf59e0b, stats: { hp: 175, attack: 75, bulletSpeed: 250 } },
    { id: "wind_runner", name: "疾風者", color: 0x3b82f6, stats: { hp: 90, attack: 45, bulletSpeed: 600 } }
  ]
};

// ==========================================
// 2. AUDIO SYNTHESIZER (WEB AUDIO API)
// ==========================================
class SoundFX {
  constructor() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  playShot() {
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.15);
  }
  playDodge() {
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.12);
  }
  playHit() {
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.2);
  }
}
const sfx = new SoundFX();

// ==========================================
// 3. NETWORK MANAGER (PEERJS WEBRTC)
// ==========================================
class NetworkManager {
  constructor() {
    this.peer = null;
    this.conn = null;
    this.isHost = false;
    this.roomId = null;
    this.onConnected = null;
    this.onData = null;
  }
  createRoom(onReady) {
    this.isHost = true;
    this.roomId = 'OHS-' + Math.random().toString(36).substring(2, 7).toUpperCase();
    this.peer = new Peer(this.roomId);
    this.peer.on('open', (id) => {
      const joinUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?room=${id}`;
      onReady(id, joinUrl);
    });
    this.peer.on('connection', (c) => {
      this.conn = c;
      this.setupListeners();
    });
  }
  joinRoom(targetId) {
    this.isHost = false;
    this.roomId = targetId;
    this.peer = new Peer();
    this.peer.on('open', () => {
      this.conn = this.peer.connect(targetId);
      this.setupListeners();
    });
  }
  setupListeners() {
    this.conn.on('open', () => { if (this.onConnected) this.onConnected(); });
    this.conn.on('data', (data) => { if (this.onData) this.onData(data); });
  }
  send(data) {
    if (this.conn && this.conn.open) this.conn.send(data);
  }
}
const net = new NetworkManager();

// ==========================================
// 4. PLAYER CONTROLLER ENGINE
// ==========================================
class PlayerController extends Phaser.Physics.Arcade.Sprite {
  constructor(scene, x, y, charData, keyBindings, isP2 = false) {
    super(scene, x, y, 'pixel_char');
    scene.add.existing(this);
    scene.physics.add.existing(this);

    this.charData = charData;
    this.keyBindings = keyBindings;
    this.isP2 = isP2;
    this.currentHP = charData.stats.hp;
    this.maxHP = charData.stats.hp;

    this.state = 'IDLE';
    this.isHurtboxActive = true;
    this.canShoot = true;
    this.canDodge = true;

    this.dodgeDuration = 250;
    this.dodgeCooldown = 1200;
    this.shotCooldown = 600;

    this.setTint(charData.color);
    this.setFlipX(isP2);
    this.body.setCollideWorldBounds(true);

    this.applyHPScale();
    this.renderHalos();
    this.bindInputs();
  }

  applyHPScale() {
    const { hp } = this.charData.stats;
    const { min, max, scaleMin, scaleMax } = CHARACTER_SCHEMA.bounds.hp;
    const norm = Phaser.Math.Clamp((hp - min) / (max - min), 0, 1);
    this.scaleFactor = Phaser.Math.Linear(scaleMin, scaleMax, norm);
    this.setScale(this.scaleFactor);
    this.body.setSize(24 * this.scaleFactor, 32 * this.scaleFactor);
  }

  renderHalos() {
    const { bulletSpeed } = this.charData.stats;
    const { min, max, haloMin, haloMax } = CHARACTER_SCHEMA.bounds.speed;
    const norm = Phaser.Math.Clamp((bulletSpeed - min) / (max - min), 0, 1);
    const count = Math.round(Phaser.Math.Linear(haloMin, haloMax, norm));

    this.haloGraphics = this.scene.add.graphics();
    this.haloGraphics.lineStyle(2, 0x00ffcc, 0.8);
    for (let i = 0; i < count; i++) {
      this.haloGraphics.strokeCircle(0, 0, (14 * this.scaleFactor) + (i * 4));
    }
  }

  bindInputs() {
    if (!this.keyBindings) return;
    this.shotKey = this.scene.input.keyboard.addKey(this.keyBindings.shot);
    this.dodgeKey = this.scene.input.keyboard.addKey(this.keyBindings.dodge);
    this.shotKey.on('down', () => this.tryShot());
    this.dodgeKey.on('down', () => this.tryDodge());
  }

  tryShot() {
    if (!this.canShoot || this.state === 'DEAD') return;
    this.canShoot = false;
    sfx.playShot();
    
    const dir = this.isP2 ? -1 : 1;
    this.scene.spawnBullet(this, this.x + (dir * 20), this.y, dir, this.charData.stats.bulletSpeed, this.charData.stats.attack);

    this.scene.time.delayedCall(this.shotCooldown, () => { this.canShoot = true; });
  }

  tryDodge() {
    if (!this.canDodge || this.state === 'DODGING' || this.state === 'DEAD') return;
    this.canDodge = false;
    this.state = 'DODGING';
    this.isHurtboxActive = false;
    sfx.playDodge();

    this.setAlpha(0.3);
    const dist = this.isP2 ? 100 : -100;

    this.scene.tweens.add({
      targets: this,
      x: Phaser.Math.Clamp(this.x + dist, 80, 880),
      duration: this.dodgeDuration,
      ease: 'Cubic.out',
      onComplete: () => {
        this.setAlpha(1.0);
        this.isHurtboxActive = true;
        this.state = 'IDLE';
      }
    });

    this.scene.time.delayedCall(this.dodgeCooldown, () => { this.canDodge = true; });
  }

  takeDamage(amount) {
    if (!this.isHurtboxActive || this.state === 'DEAD') return;
    this.currentHP = Math.max(0, this.currentHP - amount);
    sfx.playHit();

    this.setTint(0xffffff);
    this.scene.time.delayedCall(120, () => this.setTint(this.charData.color));

    if (this.currentHP <= 0) {
      this.state = 'DEAD';
      this.isHurtboxActive = false;
      this.setAngle(90);
      this.scene.onKilled(this);
    }
  }

  preUpdate(time, delta) {
    super.preUpdate(time, delta);
    if (this.haloGraphics) {
      this.haloGraphics.setPosition(this.x, this.y + (16 * this.scaleFactor));
    }
  }
}

// ==========================================
// 5. AI CONTROLLER (3 DIFFICULTIES)
// ==========================================
class AIController {
  constructor(scene, aiPlayer, humanPlayer, difficulty = 'MEDIUM') {
    this.scene = scene;
    this.ai = aiPlayer;
    this.human = humanPlayer;
    this.difficulty = difficulty;
    
    // Difficulty Settings: [Reaction Min, Reaction Max, Dodge Probability]
    this.config = {
      EASY: { delayMin: 250, delayMax: 350, dodgeChance: 0.4 },
      MEDIUM: { delayMin: 150, delayMax: 250, dodgeChance: 0.7 },
      HARD: { delayMin: 80, delayMax: 150, dodgeChance: 0.95 }
    }[difficulty];

    this.timer = scene.time.addEvent({ delay: 200, callback: this.updateAI, callbackScope: this, loop: true });
  }

  updateAI() {
    if (this.ai.state === 'DEAD' || this.human.state === 'DEAD') return;

    const dist = Phaser.Math.Distance.Between(this.ai.x, this.ai.y, this.human.x, this.human.y);

    // 1. Reactive Dodge Check: Scan incoming bullets
    this.scene.bullets.getChildren().forEach(bullet => {
      if (bullet.active && bullet.owner === this.human) {
        const bulletDist = Math.abs(bullet.x - this.ai.x);
        if (bulletDist < 300 && this.ai.canDodge) {
          const delay = Phaser.Math.Between(this.config.delayMin, this.config.delayMax);
          this.scene.time.delayedCall(delay, () => {
            if (Math.random() < this.config.dodgeChance) {
              this.ai.tryDodge();
            }
          });
        }
      }
    });

    // 2. Predictive Shot Check
    if (this.ai.canShoot && Math.random() < 0.5) {
      this.ai.tryShot();
    }
  }
}

// ==========================================
// 6. PHASER GAME SCENES
// ==========================================

// SCENE 1: MENU & CHARACTER SELECTION
class MenuScene extends Phaser.Scene {
  constructor() { super('MenuScene'); }
  create() {
    this.add.text(480, 80, '影子一擊', { fontSize: '48px', color: '#60a5fa', fontFamily: 'Courier New' }).setOrigin(0.5);
    this.add.text(480, 130, 'One-Hit Samurai', { fontSize: '20px', color: '#94a3b8' }).setOrigin(0.5);

    this.p1CharIdx = 0;
    this.p2CharIdx = 1;
    this.mode = 'PVE'; // 'PVE', 'LOCAL_P2', 'ONLINE'
    this.aiDifficulty = 'MEDIUM';

    // Selection Text
    this.p1Text = this.add.text(240, 240, '', { fontSize: '20px', color: '#ef4444', align: 'center' }).setOrigin(0.5);
    this.p2Text = this.add.text(720, 240, '', { fontSize: '20px', color: '#3b82f6', align: 'center' }).setOrigin(0.5);

    this.updateCharDisplay();

    // Mode Buttons
    this.createBtn(480, 320, '單人對抗 AI', () => this.startPVE());
    this.createBtn(480, 380, '同機雙人對決', () => this.startLocalP2());
    this.createBtn(480, 440, 'QR Code 雙人連線', () => this.openQRModal());

    // Check QR join URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      net.joinRoom(roomParam);
      net.onConnected = () => {
        this.scene.start('BattleScene', { mode: 'ONLINE', isHost: false, p1Idx: 0, p2Idx: 1 });
      };
    }
  }

  updateCharDisplay() {
    const c1 = CHARACTER_SCHEMA.list[this.p1CharIdx];
    const c2 = CHARACTER_SCHEMA.list[this.p2CharIdx];
    this.p1Text.setText(`P1: ${c1.name}\nHP:${c1.stats.hp} ATK:${c1.stats.attack} SPD:${c1.stats.bulletSpeed}`);
    this.p2Text.setText(`P2/AI: ${c2.name}\nHP:${c2.stats.hp} ATK:${c2.stats.attack} SPD:${c2.stats.bulletSpeed}`);
  }

  createBtn(x, y, label, callback) {
    const btn = this.add.text(x, y, label, { fontSize: '20px', color: '#fff', backgroundColor: '#1e293b', padding: { x: 20, y: 10 } }).setOrigin(0.5).setInteractive();
    btn.on('pointerover', () => btn.setStyle({ color: '#f59e0b' }));
    btn.on('pointerout', () => btn.setStyle({ color: '#fff' }));
    btn.on('pointerdown', callback);
  }

  startPVE() {
    this.scene.start('BattleScene', { mode: 'PVE', p1Idx: this.p1CharIdx, p2Idx: this.p2CharIdx, difficulty: 'MEDIUM' });
  }
  startLocalP2() {
    this.scene.start('BattleScene', { mode: 'LOCAL_P2', p1Idx: this.p1CharIdx, p2Idx: this.p2CharIdx });
  }
  openQRModal() {
    const modal = document.getElementById('qr-modal');
    modal.style.display = 'flex';
    net.createRoom((roomId, joinUrl) => {
      document.getElementById('room-id-label').innerText = `房號: ${roomId}`;
      document.getElementById('qrcode-box').innerHTML = '';
      new QRCode(document.getElementById('qrcode-box'), { text: joinUrl, width: 160, height: 160 });
    });
    net.onConnected = () => {
      modal.style.display = 'none';
      this.scene.start('BattleScene', { mode: 'ONLINE', isHost: true, p1Idx: this.p1CharIdx, p2Idx: this.p2CharIdx });
    };
    document.getElementById('btn-close-qr').onclick = () => { modal.style.display = 'none'; };
  }
}

// SCENE 2: BATTLE ARENA
class BattleScene extends Phaser.Scene {
  constructor() { super('BattleScene'); }

  create(data) {
    this.mode = data.mode;
    this.isHost = data.isHost !== undefined ? data.isHost : true;

    // Create Textures dynamically
    this.createPixelTextures();

    // Bullet Physics Group
    this.bullets = this.physics.add.group();

    // Instantiate Players
    const c1Data = CHARACTER_SCHEMA.list[data.p1Idx || 0];
    const c2Data = CHARACTER_SCHEMA.list[data.p2Idx || 1];

    this.p1 = new PlayerController(this, 200, 380, c1Data, { shot: 'A', dodge: 'S' }, false);
    this.p2 = new PlayerController(this, 760, 380, c2Data, this.mode === 'LOCAL_P2' ? { shot: 'K', dodge: 'L' } : null, true);

    // Setup AI if PVE
    if (this.mode === 'PVE') {
      this.ai = new AIController(this, this.p2, this.p1, data.difficulty || 'MEDIUM');
    }

    // Network Callbacks for Online Mode
    if (this.mode === 'ONLINE') {
      net.onData = (payload) => this.handleNetworkData(payload);
    }

    // Overlap Detection: Hitbox vs Hurtbox
    this.physics.add.overlap(this.bullets, [this.p1, this.p2], this.onBulletHit, null, this);

    // UI Overlay & Touch Setup
    this.setupUI();
  }

  createPixelTextures() {
    const gfx = this.make.graphics({ x: 0, y: 0, add: false });
    // Player pixel box
    gfx.fillStyle(0xffffff); gfx.fillRect(0, 0, 24, 32);
    gfx.generateTexture('pixel_char', 24, 32);
    // Bullet
    gfx.clear(); gfx.fillStyle(0xffff00); gfx.fillRect(0, 0, 8, 4);
    gfx.generateTexture('pixel_bullet', 8, 4);
  }

  spawnBullet(owner, x, y, dir, speed, damage) {
    const bullet = this.bullets.create(x, y, 'pixel_bullet');
    bullet.owner = owner;
    bullet.damage = damage;
    
    // Scale bullet sprite by attack power
    const { min, max, scaleMin, scaleMax } = CHARACTER_SCHEMA.bounds.attack;
    const norm = Phaser.Math.Clamp((damage - min) / (max - min), 0, 1);
    const bScale = Phaser.Math.Linear(scaleMin, scaleMax, norm);
    bullet.setScale(bScale);

    bullet.body.allowGravity = false;
    bullet.body.setVelocityX(dir * speed);

    if (this.mode === 'ONLINE') {
      net.send({ type: 'SHOT', owner: owner === this.p1 ? 'P1' : 'P2', x, y, dir, speed, damage });
    }
  }

  onBulletHit(bullet, target) {
    if (bullet.owner === target || !target.isHurtboxActive) return;

    target.takeDamage(bullet.damage);
    bullet.destroy();

    if (this.mode === 'ONLINE' && this.isHost) {
      net.send({ type: 'DAMAGE_SYNC', target: target === this.p1 ? 'P1' : 'P2', hp: target.currentHP });
    }
  }

  handleNetworkData(payload) {
    if (payload.type === 'SHOT') {
      const shooter = payload.owner === 'P1' ? this.p1 : this.p2;
      this.spawnBullet(shooter, payload.x, payload.y, payload.dir, payload.speed, payload.damage);
    } else if (payload.type === 'DODGE') {
      const dodger = payload.owner === 'P1' ? this.p1 : this.p2;
      dodger.tryDodge();
    } else if (payload.type === 'DAMAGE_SYNC' && !this.isHost) {
      const target = payload.target === 'P1' ? this.p1 : this.p2;
      target.currentHP = payload.hp;
    }
  }

  setupUI() {
    // Health Bars
    this.p1Bar = this.add.graphics();
    this.p2Bar = this.add.graphics();

    // Touch Controls Mounting
    const touchOverlay = document.getElementById('touch-controls');
    touchOverlay.style.display = 'flex';
    document.getElementById('p2-touch').style.display = this.mode === 'LOCAL_P2' ? 'flex' : 'none';

    document.getElementById('btn-p1-shot').onclick = () => this.p1.tryShot();
    document.getElementById('btn-p1-dodge').onclick = () => this.p1.tryDodge();
    if (this.mode === 'LOCAL_P2') {
      document.getElementById('btn-p2-shot').onclick = () => this.p2.tryShot();
      document.getElementById('btn-p2-dodge').onclick = () => this.p2.tryDodge();
    }
  }

  update() {
    // Render Health Bars
    this.p1Bar.clear();
    this.p1Bar.fillStyle(0xef4444);
    this.p1Bar.fillRect(40, 30, (this.p1.currentHP / this.p1.maxHP) * 300, 16);

    this.p2Bar.clear();
    this.p2Bar.fillStyle(0x3b82f6);
    this.p2Bar.fillRect(620, 30, (this.p2.currentHP / this.p2.maxHP) * 300, 16);
  }

  onKilled(victim) {
    const winner = victim === this.p1 ? 'P2 / AI' : 'P1';
    this.add.text(480, 200, `${winner} 獲勝！`, { fontSize: '40px', color: '#f59e0b', fontFamily: 'Courier New' }).setOrigin(0.5);

    this.time.delayedCall(2500, () => {
      document.getElementById('touch-controls').style.display = 'none';
      this.scene.start('MenuScene');
    });
  }
}

// ==========================================
// 7. INITIALIZE PHASER GAME INSTANCE
// ==========================================
const config = {
  type: Phaser.AUTO,
  width: 960,
  height: 540,
  parent: 'game-container',
  pixelArt: true,
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scene: [MenuScene, BattleScene]
};

const game = new Phaser.Game(config);
</script>
