<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古典雅集</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap');

  :root {
    --bg-color: #f4efe6;
    --paper-color: #fcf8f2;
    --border-color: #8c2d19;
    --text-primary: #2c221e;
    --text-secondary: #5c4b43;
    --accent-red: #9e2a2b;
    --accent-gold: #c68b59;
    --btn-hover: #722314;
    --shadow: 0 4px 15px rgba(0,0,0,0.08);
  }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(#e5dbc9 1px, transparent 0);
    background-size: 24px 24px;
    color: var(--text-primary);
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    margin: 0;
    padding: 30px 15px 60px 15px;
    line-height: 1.8;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 25px;
    position: relative;
    padding-bottom: 15px;
    border-bottom: 1px dashed var(--accent-gold);
  }

  header h1 {
    font-size: 2.5rem;
    color: var(--accent-red);
    letter-spacing: 6px;
    margin: 0 0 8px 0;
    font-weight: 700;
  }

  header p {
    color: var(--text-secondary);
    font-size: 1rem;
    margin: 0;
    letter-spacing: 1.5px;
  }

  /* Control Panel */
  .control-panel {
    background: #eae2d3;
    border: 1px solid var(--accent-gold);
    border-radius: 6px;
    padding: 15px 20px;
    margin-bottom: 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.05);
  }

  .nav-tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: var(--paper-color);
    border: 1px solid var(--border-color);
    color: var(--border-color);
    padding: 8px 18px;
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
  }

  .tab-btn:hover, .tab-btn.active {
    background: var(--border-color);
    color: #fff;
  }

  .action-btns {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    background: var(--accent-red);
    color: #fff;
    border: none;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 0.92rem;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }

  .btn:hover {
    background: var(--btn-hover);
  }

  .btn-gold {
    background: var(--accent-gold);
  }
  .btn-gold:hover {
    background: #a87143;
  }

  .status-msg {
    font-size: 0.88rem;
    color: var(--accent-red);
    margin-left: 8px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .status-msg.show {
    opacity: 1;
  }

  /* Section Title */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
    margin-top: 20px;
    margin-bottom: 25px;
  }

  .section-title {
    font-size: 1.5rem;
    color: var(--border-color);
    letter-spacing: 2px;
    margin: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 22px;
  }

  /* Note Card */
  .note-card {
    background: var(--paper-color);
    border: 1px solid #e0d5c1;
    border-top: 4px solid var(--border-color);
    border-radius: 4px;
    padding: 20px;
    box-shadow: var(--shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .note-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px dashed #dcd1be;
    padding-bottom: 6px;
  }

  .card-index {
    font-size: 0.82rem;
    color: var(--accent-gold);
    font-weight: 600;
    letter-spacing: 1px;
  }

  .card-actions {
    display: flex;
    gap: 6px;
  }

  .mini-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .mini-btn:hover {
    background: #e8ded0;
    color: var(--accent-red);
  }

  .note-content {
    font-size: 0.98rem;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
    outline: none;
    min-height: 80px;
    padding: 6px;
    border: 1px transparent dashed;
    border-radius: 3px;
    transition: border-color 0.2s;
  }

  .note-content:focus {
    border-color: var(--accent-gold);
    background: #fffdfa;
  }

  .seal-mark {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 26px;
    height: 26px;
    border: 1px solid var(--accent-red);
    color: var(--accent-red);
    font-size: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    opacity: 0.35;
    pointer-events: none;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>古典雅集</h1>
    <p>收錄《00記事本.xls》全數創作 ｜ 支援即時編輯、新增卡片與本地存檔</p>
  </header>

  <div class="control-panel">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('ALL')">全部創作</button>
      <button class="tab-btn" onclick="switchTab('創作(小品)')">創作(小品)</button>
      <button class="tab-btn" onclick="switchTab('創作(詩詞)')">創作(詩詞)</button>
      <button class="tab-btn" onclick="switchTab('創作(雜作)')">創作(雜作)</button>
    </div>
    <div class="action-btns">
      <button class="btn btn-gold" onclick="addNewCard()">➕ 新建便簽</button>
      <button class="btn" onclick="saveToLocalStorage()">💾 儲存變更</button>
      <button class="btn btn-gold" onclick="resetData()">🔄 還原初始</button>
      <span id="statusMsg" class="status-msg">已存檔！</span>
    </div>
  </div>

  <main id="notesContainer">
    <!-- 便簽內容由 JS 自動動態渲染 -->
  </main>

  <footer>
    <p>古典雅集 電子便簽系統 ｜ 編輯後請記得點擊「儲存變更」儲存至瀏覽器本地紀錄</p>
  </footer>
</div>

的片刻，記錄了情蔓恣長的相思樹林，那林外湖畔紅豆園裡的女孩，女孩依然在心湖上佇足，湖上的漣漪依舊泛動著相思，沉睡的盼望瞧來讓人心動，寄情湖畔的昨夜不曾迎來黎明；", "未曾寫完的寄情詩在筆端鼓噪，被擱置的文房四寶悸動著，不曾枯乾的思念泉湧著，等待揮舞筆墨的時刻到來。", "思念讓人堅強、也讓人軟弱；堅強的為思念之人等待，卻也軟弱於等待之時。", "晴空霹靂，這突如其來的聲響劃破天際，彷彿天裂開了般，我倚窗揣著書，癡癡望著天空，放空的思緒牽動記憶裡女孩的笑容，甜甜地在心湖醞釀著。", "是啊！過去如交響樂激舞著生命，己成為生命中的故事被訴說著，讀起了集中營的回憶錄，莞爾一笑，瞧著過去也去了一遭啊！對於絕望中尋找的永恆，倚靠著上帝的同時，早已了然於心。", "思緒再化為思念，悄悄地隨蝶舞停佇在時間的末梢，一段又一段的流沙似金，彼此銜接著，情意綿綿的被帶走了；錐心刺股的也被帶走了；卻留下意猶未盡的彼此，品嚐著回憶的百味雜陳，而生命被應許的諸多恩典，在歲月流逝中被逐一彰顯，人生旅途的瑰怪崎麗，成就了上帝手中獨一無二的藝術品。", "如果你也開始欣賞起自己的生命，彈奏起上帝為你編攥的天籟伶音，不妨用專屬的微笑，分享在生命中揮洒的感動，就像此刻的我，為女孩淺淺微笑而獻上祝福..............................\n～念著妳，只是掛心妳，忘了微笑。", "湖心亭畔.夜沁如霜..\n月娘展顏.凝脂若水....\n湖心亭畔盼心湖.心湖漪漣惹心醉..\n曳灑酸楚幾多愁.古來相伴皆寂寞....", "敬 一干傷心碎心無心人~", "微笑是我的音符.朋友們的點滴是我的節奏..用歡樂形成我的曲目~我舞動歲月的足跡......譜寫上記錄的動人章節~用淚水註解舞姿的頓點.在一段段的音樂裡交響出多重奏......我的生命之舞.樂舞著", "Vodka lime..是今晚的伴侶......人生的踽踽歸途..寂寥莫何的時刻~在這伴隨著飄渺霧氣的夜晚..我佐上一股愜意.順了兩口隨意..仰望著.沉重的眼皮在淚痕沾染下~放下了過去..", "依然睹物思人.依然觸景傷情.依然多愁善感.依然默許淚滴......太多的時間.都給予了情感.在心湖的小徑上留下淺淺的足跡.那在漫漫長夜信步闌珊的身影..不是誰.依然是落寞的騷人墨客.卻道天涼好個秋的輕嘆~", "細雨斜絲.應了心上陣陣淌血;鼓鼓雷聲.嘶吼無言句句吶喊..落地窗前.形單影隻漸漸沁冷..傻子呆著.楞著瞧著踽踽孤寂......這雨來的急.好不如巧.順了情表了意.似天可憐見的哀鳴......給了人們一聲.生命交響曲的休止~就是該這般.享受當下的心情^_^*不如意.又如何......捻著鬍渣佐上一杯咖啡.這也是場下午茶的響宴~我愛", "心之所繫是為家;心.無以為繫;然.何以為家..嘶吼吧!靈魂..在夜裡狂奔的肆無忌憚.在血脈奔流的狂野悸動....都是撒旦的呼喚.呼喚著原為惡魔的靈魂.在神的默許下......歸化為撒旦的羽翼.背上倒立的十字架.是被神遺棄的證明;而胸口淌血的傷口.是無法被救贖的血證.罪~是無法被赦免......罪人.其實早就不算是人~神給予的窗.其實只是通往另一個被關上門的房間....而惡魔.其實只是被神給遺棄了的人們靈魂", "一滴淚.泛起了悠悠心湖的漣漪.淺淺的憂鬱.是詩人心底的足跡~淡淡的哀愁.是舖陳七夕的序曲......洗淨鉛華的脫俗.悄悄的在心湖湧現.平靜依舊~多惹了歲月的激情.在這鵲橋的兩端......我不是過橋的人.我只是個過客~七夕情.兩端戲.郎情妾意倆相遇;獨一人.心一橫.橋下不妨看場戲......七夕.祝有情人終成眷屬.祝無情人各奔所屬~^__________^", "雨.挑起了焦躁.掀動了不安..斷斷續續.卻驚擾了這一池春水......尋著坦然的路徑.一步一步安撫著這被激盪的漣漪..由創作來肯定自己.緩緩的....又將自己導到明境亦非台的澄明.這一刻的颯爽.悄悄的再拿起仕瑜兄贈的書籍..再來玩味一番~似曾相似的心境.在書的領域裡發酵著.傳遞出一份期盼.以書會友......仕瑜兄果真雅痞", "狂野.殘暴的撕裂著靈魂..極盡能事的毀壞著.在存在與虛無間恣意....光怪陸離的一切.吞噬著僅有的青春..肆無忌憚的予取予求....我.僅存著佝僂之軀.一圖在洪荒歲月裡力挽狂瀾....時也.命也.運也~非我之不能也", "沈默.是一場無止盡的戰爭..瘋狂.是刹那間被錯置的真實;恐懼.是交錯的內心中唯一的自我..黑夜.是伴隨著月色的協奏曲.而.沈默..依然是一場無止盡的戰爭..而已", "多情總被無情苦.多心卻被無心傷.清風拂面水無痕.何妨莞爾笑一場..", "螢星滿落華園池.枝稍葉末顯蹤隻.夜蓋華羅欲成事.無擾人間半點遲..<<正肅>>", "搖曳著燭光的夜..伴隨著欲拒還迎的羞澀光影\n在灑落一地的月光中..悄悄地啜了口紅酒\n放暖的花兒......燦爛的光舞在燭台上\n輕舞浪漫的..正訴說著在父神懷中的喜樂\n與結縭將一世永恆的她..", "我祈禱......將見證耶和華最真實的美好"], "創作(詩詞)": ["煙飄昔日逝，曲盡燭淚催；今朝一別去，親故人離散。", "─白．正肅<<祭二叔>>2013.6.29", "<<萬物到頭終有歸.歸時難留無命客\n客從彼方還遠方.方外終歸化萬物>>\n-----------------------------正肅2013.6.19", "臉紅紅.心驚驚.五月十一樂欣欣;\n丈阿哥.丈阿姐.無緣不忘舊小婿;\n有點驚.有點怕.但求伊人不簇踏;\n如果行.許個願.我倆有緣再相見。", "憶辣媽節心有戚戚─打油詩作", "毳雨花落誰家院，冷弦夜半應覺寒。\n蓬門倚望淚秋水，幽幽空曲催腸斷......", "回去不回去?不回哪裡去?回了何處去.不如不回去~唉", "清明時節雨紛紛.為伊七夕淚縱橫.借問酒家何處有.牧童欲語淚還流..", "且聽雨聲打穿林，\n何不徐行待嘯吟。\n竹杖芒鞋意輕馬，更勝？\n一曲瀟瀟縱千行，\n斜絲落雨打罄滿，\n不覺，日夕迎暉映渡波，\n回首蕭瑟向來去，\n來去，一者風雨二者晴\n正肅  定風波", "瀟瀟..夜雨.徐徐\n..濛濛.心湖..戚戚\n幽幽.身影..踽踽\n亂啊!......亂漪漣", "<<泣涕悲愁哀若親.道逝往昔痛失憶\n寸許誨晤存如詩.長嘆師恩何能息>>正肅\n<泣睦容師以憶之>", "秋鬱無心爾化愁.愁對玉兔伴吳剛;\n中秋未若中元渡.相形相似不相伴..", "<<清風兩袖隨波流.落花幾葉看風飄\n身無長物徒留情.一字以祭話古今>>", "三月桃花梔子伴，欲隨繭兒化作蝶；長願喜鵲聲不斷，共傳佳話渡良緣。", "─白．正肅 <<桃梔共伴獻佳偶>>", "白．正肅 <<仿於潛僧綠筠軒>>\n寧使食無肉，怎可飲無酒。無肉使人瘦，無酒令人愁。\n人瘦尚可肥，愁情無藥醫。旁人笑此言，似愁欲還留。\n若對此情仍大礙，世間豈有七夕合？", "<<述識十六餘.致林兄喜得靓(亮)女>>\n學載初識十有六，不夜室設共杯酒；\n輒夜一曲訴衷情，三五漢子同相惜。\n離曲依依分東西，卻莫忘懷渡舟誼；\n迎春逢喜慶相聚，再敘今昔話古今。", "一飲瓊漿文如泉.一曲縱情墨似詩\n無從江郎之才盡.獨獨洋灑之豪情..", "徹夜狂風呼嘯..清晨一抹幽然.\n遍地盡殘花落葉......\n憐我心頭攸攸.獨愴然之戚戚..\n我立風中兩袖悲.獨飲洪流石上泉~", "氛外綿綿亦有歇..看似有情卻無情..\n一曲暫過分東西..明朝不知何處尋....", "真露颯爽猶未盡.餘韻緻雅絕高麗.\n一飲千杯迎璿姑.琇美不及伴佳人..", "<<遺故居臻，一遠感懷>>\n風雅未減意延綿，繾綣餘韻冠華年；\n一縷青絲伴紅妝，半晒人間更勝仙。\n乙未年杏月 正肅", "《詠臻娘》\n一襲黑紗縷相思，\n双飛蝴蝶伴相随；\n絲竹輕曲化玲瓏，\n更添佳人一點紅。\n乙未年仲春 正肅", "《絕了》\n飛花落葉戲殘雪\n孤影獨身笑灰雁\n同是終歲末路客\n何妨藉酒一着眠", "持杯縱千古.今明兩不識.\n曲幽和亦寡.醉酒獨一人；\n提筆疾行書.意恐勝念思.\n雙雙隔胡越.魚雁難往返；\n寄情落千秋.萬里不辭行.\n踽踽畫五四.不知提所以；\n諾然盡瓊漿.故人舊安思.\n話隨筆落塵.我卻眷如昔.."], "創作(雜作)": ["6月19日23點53分\n一封突如其來的簡訊..\n告訴了我..原來二十年了\n我一直以為不會那麼快......一直以為", "小白......\n二十年前..外公帶牠進了我們這大家族\n初來乍到的牠.顯得生澀害羞\n但很快的..牠成了這大家族的一員\n活潑.熱情..有個性....\n媽媽對小妹說:琳琳.妳忘了妳小時候硬要拖小白跟妳走了嗎?\n大家笑了笑......揶揄了一下\n沒想到那麼快..我一直以為還有時間去看牠", "~在牠將去見外公時......\n不知道能否為我捎個信..", "二十年了......\n經歷了九二一..我們一起撐過了\n承受了外公仙逝的哀傷..我們也熬了過來\n時間沒停過..\n陪伴著牠的小阿姨一家..因為搬了家\n漸漸的少了與牠相處的時間......\n小白依然守著我們的山上..\n~依然望著外公熟悉的野狼125..", "小白開始老了..也生病了\n不再活潑..不再熱情....不再有個性了\n曾幾何時......或許夢見了外公\n又要帶著牠去下一段旅程了", "~外公......\n您一定要照顧好小白..\n在您離開了我們的這些日子......\n牠一直代替您陪伴著我們..", "小白..你放心\n我們會堅強..就像你用這二十年告訴我們的一樣\n你放心......\n哭完了..明天我們依然會站起來\n~像你守候外公的野狼125一般..", "那年..\n我見到意識模糊.垂淚回應的外公......\n痛......好多話只能笑著對黑白照片訴說\n這次..\n我又錯過了..在我一直以為的以為中", "沒有我之前.妳過得一樣好;有了我之後.也沒改變什麼..\n我似一葉落在湖面的肩舟.驚鴻一瞥中現了蹤跡..\n卻又悄悄的在歲月的洪流中消失......\n妳說懂我的孤寂.卻難以解開這千古未解的結;\n我也懂妳的信任.妳是相信..我曾經訴說過未來的承諾的吧!?\n上天不輕易的告訴我終點..但她的存在不是終點\n~而是生命的起點......\n時間是手指縫中留不住的沙.妳是曾經予了我夢想的天使..\n我渴望被救贖.在妳呢喃的仙樂飄飄裡~我再一次的相信了我對未來的憧憬......\n牧童.催促著佇足流水的牛兒走了\n~葉的飄落.是風的追求?還是樹的不挽留......\n我將思念遙寄遠方.卻猶豫著還能相信著天使的存在嗎!?\n躊躇不定..又得在人生路上耽擱了\n~時光荏苒.何處是我家?縱能一笑.也難忍踽踽歸途......", "又想起妳了.妳知道嗎?", "面對生命中的註解.學習如何莞爾一笑..\n故事終究是故事.剩下的在乎在何處?\n隨著時間敲響.樂章上的音符翩然舞起....\n不曾停的.是春過迎夏又逢冬~", "佝僂之軀難掩洪流..雲鬢更添慽慽憂情", "窗外的雨.透過聲音的暈染..\n顯示出她的哀愁......", "淅瀝淅瀝.\n是她無語的悸動......", "落下了屬於她的思念.憂傷.及哀痛..\n在心湖上不停的泛起漣漪~\n驚醒的我..\n悄悄拭去眼角的淚痕.卻拭不去......\n在心上的傷痕;", "雨.又在心湖上造次了..\n她用淚洗淨塵埃.卻去不了~\n刻骨銘心的失落......", "又更張牙舞爪的顯示她的占有~\n妳奪走了我的眷戀..\n擊敗我的執著.妳勝利了......\n但妳終究是場雨.一場雨過終會天晴的雨~", "<<七月二八凌晨夜雨一記>>正肅", "..........徐徐雨.點點情.寸寸思.踽踽行\n~微雨對小酌.豪情剎狂飲..來杯吧!", "是放下!?還是放逐!?\n是接受!?還是承受!?\n是空!?還是空空!?", "風.吹拂心湖.又.泛了一波.不停漣漪\n多惹心愁.更.憂憂我心~希望如果還能希望.絕望就不該絕望\n<<當你失去盼望時.必會出現主的榮光>>", "阿難佛前化石橋.風吹日曬五百笑\n江郎別賦訴黯然.形削骨立泣魂銷\n我立風中孤心悲.無語蒼天問何誰\n且縱瑯環四一居.一天地伴一人筆\n<<癸巳文青四一記>>正肅", "癸巳.年也;文者.撰筆而行;青者.無心之情\n四一者.一天一地.一人一筆..", "夢..憶起過去的足跡;\n..風.吹動往昔的浪漫~\n幽幽夜裡的點滴纏綿..夢醒時分的迷濛淚眼\n......驚醒湖畔流浪的詩人靈魂~", "獨自一人.並不是愛上孤獨..\n而是.未能找著~一縷與自己相契合的靈魂", "我.在烏托邦..想像著桃花源\n<<桃花源>>正肅", "寄情湖畔記情詩.寄情詩裡記情史\n寄情史裡訴記情.又復情湖訴情詩\n<<八九寄情>>正肅\n八九年記.人生不如意十常八九\n唯寄情一二..寥以慰之", "Cheers~為生命乾杯......\n醉了.醉在靈魂溢出的佳釀\n..以感動為榖.靈魂為麴\n在汗與淚的沉澱.除去了情感的雜質~\n用友情加溫.淡淡的溫酒清香\n~佐上些微遺憾的酸楚......\n沒有愛情的甜美.卻擁有時間酵化的醇香..", "你來了嗎?", "跟我喝上一杯吧!~這來自歲月的味道\n暫歇.小亭..醉人.也醉心......\n<<醉心亭>>正肅", "那一年..是我們青澀的二八年華\n她出現了......\n在我們迷惘的年代.高職老師的她~", "每隔幾年.我總會回學校找她..\n前些日子~\n她說我像個文人了..瞧得出她很開心\n知道了我參加國考的同時..\n她說......她答應我錄取時跟我們吃飯", "她說了好多..好多\n有老師的家庭.有現下的學生......\n我也看到了老師她為人母的歡欣..", "突如其來的一聲惡耗.老師走了~\n九月十一即將出殯..", "我~", "愣了半晌.半晌.又半晌......\n遲遲不能接受..\n很意外的......在這時刻\n我..多喝了幾杯", "老師.請容許我..再多喝幾杯\n您......還沒見到我成為詩人的那天", "您忘了嗎!?", "花瓣上的初露.是她昨夜的嘆息..\n..無助的垂淚.是存在與虛無的戰爭\n自顧自憐.多惹憂愁......\n殘花何須戲敗柳.同是天涯淪落人\n~相逢.何必曾相識..\n手中的沙.從指縫中流逝......\n......細數的過往已不複見.殘存的缺\n也僅僅.是一廂情願的自作多情\n我~還能愛.卻不如以往的......\n能承受了..", "湖心亭畔.夜沁如霜..\n月娘展顏.凝脂若水....\n湖心亭畔盼心湖.心湖漪漣惹心醉..\n曳灑酸楚幾多愁.古來相伴皆寂寞....", "敬 一干傷心碎心無心人~", "你們娶了..妳們嫁了....\n我好似落下了......\n在風中追逐飄零的葉子.在霧中找尋失落的影子..\n憐憫是種無謂的施捨......在愛的話語裡\n我譜寫一個人的故事.我奏起一個人的樂章..\n無名指的孤獨突顯生命歲月的寂寥......\n我想得多了..自古多情空餘恨\n我不聰明..智慧顯得離我太遠\n上帝......一切都給祢了\n在我靈魂未被撒旦征服前~", "浮動的心.在鼓躁著..\n第三場惡耗..在以為黑色星期五結束時\n......被開啟\n繼二叔.老師..這次......是他了", "他曾笑著說......\n咱們這種人就別害人了.結婚!?\n跟我是扯不上關係的..\n......的確.他是個遊戲人間的浪子\n放縱人間的浪子..\n愛好自由.在他眼中人生顯得簡單......\n家人擔心他.但.終歸也該放下心了..", "一場意外的工觴..他離開了.在他喜歡的地方\n他曾說他最愛去工地......\n享受工作完小酌的歡樂..我總是笑了笑", "大表哥.你離開了..\n僅管了解你對這世界原本就沒有多大留戀~\n但是.我們都有相同的一份責任......", "或許你玩夠了..我像風一樣的老哥\n再見了......我還是想問你\n哥..你的放逐......也是在逃避些什麼嗎!?", "又看見時間的足跡了..\n它在門外哆嗦著......它是.唯一虛無的存在", "結束了......大表哥上路了\n..............................上路了", "那晚....空心木頭出現時..\n我瞧見了一個身影.閃進了房門", "阿姨一直讓自己很忙碌的......試圖淡忘些什麼\n中午時..她一直訴說著大表哥不聽話的過去 ..\n我知道我不能哭..僅管我了解了阿姨的思念......\n阿姨再傳統不過了....一輩子為家庭無怨無悔付出的她\n刀子嘴豆腐心.更是再傳統不過了......我卻懂得\n我這阿姨她訴說著感情的一切......在房裡的她\n不是個會窩在房裡的她~我懂得\n她害怕那個來帶走她兒子的空心木頭......\n....那個讓她空了心的木頭棺木\n我想.我或許是個愛哭鬼!", "姨丈呢!?他很堅定......\n一個好兒子.好丈夫.好爸爸..顯示出他的鎮定\n只是......姨丈多喝了些酒.喝過酒的我\n卻看出了姨丈在這晚想掩蓋的一切......\n他想醉一場..在姨丈刻意的迴避大表哥相片的那刻\n我感受到他在心底的那份隱忍..那份痛楚\n直到......在化給大表哥我們最後的心意時\n姨丈..他出現在一個不起眼的角落\n雙手緊握.深怕漏了什麼..深怕他遠方的兒子收不到了什麼\n到了最後.他轉身離開......我知道.姨丈的腳步\n每一步的沉重.都不是我們的理解的負荷..\n我想.我真的是個愛哭鬼吧!!", "一早的我.趕著送大表哥入殮......", "大表哥的事.是不能讓這兩個老人家再操心的..\n我卻還是看見了......\n在轉角門邊.有個身影..有個想見不敢見的身影\n偷偷的落淚..其實.阿姨沒有那麼堅強......\n....在她自以為沒事的跟我對大表哥的事..聊個不停時\n我......又一次想狠狠的陪著阿姨哭個一場..", "終於.大表哥要告別長輩了......\n親家公走了出來..那個大表哥100歲的親爺爺\n姨丈他.自然的讓我們覺得一點都不自然..\n我想..姨丈知道.他不可以讓100歲的老爸......\n......再更感到悲傷了\n但..告別的那刻....................\n阿姨..阿姨的淚還是決堤了......她38年含莘茹苦的兒子..\n我們這些兄弟姊妹.很堅強的保持了應該有的莊嚴氣息......\n雖然..眼涙還是不爭氣的流下了.我們..\n只是默默的轉頭拭去......我知道.大家想得都一樣\n我們要堅強的支撐起一切......這.就是人生.就是未來", "100歲的親家公..淡淡的說了聲.他去修行了......\n在親家公的那個年代.我懂得......\n大表哥對他的重要.那年代..的那份重視\n我們猜想著......大表哥的成家立業\n是不是他老人家在等待的最後一件事!?", "我..一直不敢想太多\n想太多那些真實的存在......傳承.責任", "長輩們的淚水.讓我難以承受..", "......我又想起了.再也不能見的酸楚\n人.到底有多堅強!?其實..只是還沒看到真實\n不是嗎!?", "點點滴滴..整理了起回憶\n敲響在睡夢中的風鈴......悄悄的\n記憶成影格般的在微笑中快轉著....\n其它的我.是不是!?..也有共同的曾經\n落葉..泛起心湖上的漪漣\n這憂.這愁.這哀..這怨......\n卻都是存在的足跡..\n風來了.該穿大衣了....是人生\n過猶不及......或許我的存在過份的簡單了點\n過去的微笑嘻鬧聲依然猶言在耳..\n..起點即是終點\n這一遭路.若不是悲歡離合......\n又何嘗能..脫袍而去.獨留一身瀟灑\n時間快了些..讓孱弱的靈魂響起了離歌\n不是愛上孤獨......是漸漸習慣", "冬幕時節.瑞雪悄悄揭開序幕..聖誕鈴聲響起~敲響\n祝福到來的訊息..昭然若揭的思念~伴隨著柳絮般\n的輕柔樂章.在優雅麋鹿翩然起舞下..感染了節慶的\n氛圍~聖誕......是想念的季節.我在遙遠的彼方..\n獻上給女孩的祝福..欣賞妳的美貌~那是應許存在的\n唯一..聖誕快樂.給一個女孩.在我心湖畔的小均", "搖曳著燭光的夜..伴著欲拒還迎的羞澀光影\n在灑落一地的月光中~悄悄地啜了口紅酒\n放暖的小花......燦爛的光舞在燭台上\n輕舞浪漫的咪~正訴說著在父懷中的喜樂\n與結縭將一世永恆的他..\n~我祈禱......你們將見證最真實的美好^_____^", "眺望~挑旺\n清晨.在沉悶的空氣中甦醒......梳洗完沉靜了下心靈~翻起了書\n依稀聽見了窗外夾雜的細碎聲響..打開了窗~一道光映入了眼簾\n沉重的空氣依舊沉悶著.原以為開了窗會有轉變的我....誤會了\n上帝的恩賜廣澤萬民.不獨厚一人......愛不會硬生生的流進停止的空間\n於是..我打開了房間的另一扇門.屬於這空間的心門~\n氛圍開始變化了..從時間靜止的空間中脫離.空氣們活躍了起來\n腦中響起上帝靈裡的活泉..僅管還想念著難忘的她.祂卻漸漸撫慰了我\n我祈禱著.上帝聽見了......從眼進入了我的思想.卻在心門敲啊敲\n~孩子啊!我來了.這門!?\n焦急的我.失了聲的嘶吼著..鑰匙呢!?鑰匙呢!?我的鑰匙哪..\n我的記憶.為了保護而藏匿了許多片段..那些撕裂無數夜晚的記憶碎片\n那些分不清是現實與夢境的過去~盤根錯結地糾結在靈魂的空隙中\n別人口中的故事成了自己的悲劇..倚著上帝.殘破佝僂的身得以苟存\n其實我已經可以漸漸的站著了..但還止不住眼中流下的汗水~\n失憶.原來是最後的奢侈....\n但.生命是場敬拜.必要成就美好.獻給上帝..我因信而等候神\n轉化我過去所有的一切.理解上帝的真意......成就我最真實的樣貌\n~上帝不忍祂的孩子跌倒受傷.除了為成就孩子在祂裡最真實的樣貌..", "思念讓人堅強、也讓人軟弱；堅強的為思念之人等待，卻也軟弱於等待之時。\n晴空霹靂，這突如其來的聲響劃破天際，彷彿天裂開了般，我倚窗揣著書，癡癡望著天空，放空的思緒牽動記憶裡女孩的笑容，甜甜地在心湖醞釀著。", "是啊！過去如交響樂激舞著生命，己成為生命中的故事被訴說著，讀起了集中營的回憶錄，莞爾一笑，瞧著過去也去了一遭啊！對於絕望中尋找的永恆，倚靠著上帝的同時，早已了然於心。", "思緒再化為思念，悄悄地隨蝶舞停佇在時間的末梢，一段又一段的流沙似金，彼此銜接著，情意綿綿的被帶走了；錐心刺股的也被帶走了；卻留下意猶未盡的彼此，品嚐著回憶的百味雜陳，而生命被應許的諸多恩典，在歲月流逝中被逐一彰顯，人生旅途的瑰怪崎麗，成就了上帝手中獨一無二的藝術品。", "如果你也開始欣賞起自己的生命，彈奏起上帝為你編攥的天籟伶音，不妨用專屬的微笑，分享在生命中揮洒的感動，就像此刻的我，為女孩淺淺微笑而獻上祝福..............................", "～念著妳，只是掛心妳，忘了微笑。", "序\n睽違多時，35年的時間不長，卻也說不上多短，我最親愛的老爹與媽咪，終於在這時間拍了一組屬於她們的婚紗照，當然我們，也少不了運用這個機會，留下了我們的身影，於是，屬於我們的家庭照，也因應而生。", "從前從前從前，回朔到35年前；那年，草草的在家門口拍了一張不算婚紗照的婚紗照，沒多久我出世了，爹爹當兵了，典當了一只結婚戒指的小家庭，在退伍後展開了新生活，一路喜怒哀樂地扶持至今，記憶裡剩下的，是家人的微笑，生命中的歡樂苦痛，都是為了展開微笑而存在；很高興的，我們一直重視著彼此，而這份屬於家人的禮物，則成為了這35年紀錄的獻禮，我愛你們，正如你們愛我，親愛的老爹與媽咪~父親節禮物，獻給父親，也獻給我所有的家人。", "2014/8/8 By 志源&冠瑋&依琳\n未完待續......", "時間讓信心逐漸崩壞，潰散的自我碎片質疑著存在的價值，故事發展顯得矯情異常，輒逢暫歇片刻，卻總叫心煩意亂糾結不已，我是誰？另一段的旅程又在哪？", "想念外婆的小孩們", "十幾個小孩，在廚房與曬著鹹菜的廳堂之間跑來跑去，笑聲、腳步聲交錯著，等著阿嬤炸雞塊。", "那時候的我們，總覺得時間很長..", "聽著阿公說起日據時代的故事，那些曾經發生在他生命裡的真實，在年幼的我們耳裡，像是一段段遙遠的故事。看著阿嬤在廚房裡忙進忙出，端菜、炸雞塊、張羅著一大家子的忙碌，也從來沒有想過——就在那些尋常的日子裡，我們正一點一點長大，而阿公阿嬤，也一點一點老去了......", "後來，小孩們長大了。", "各自忙著工作、家庭，忙著生活裡大大小小的瑣事。偶爾抽空回去陪陪阿公阿嬤，總以為下一次還會有時間，明天還可以再回來，下一個節日還能再一起吃飯。", "我們以為，時間會一直在那裡等著我們..", "直到有一天，阿公阿嬤一個接著一個，先停下了腳步；那一刻才明白，原來時間從來沒有多給我們任何特權，它對每一個人都是公平的；也是從那時候開始，我們突然懂得了很多以前不懂的事——愛要及時說，想念要及時表達，想抱的人，就要立刻抱緊。因為有些「下次」，真的不一定還會有。", "十幾個小孩，如今都已經長大了；偶爾聚在一起，還是會念著當年阿嬤炸的雞塊，說著誰偷偷跑去吃曬好的鹹菜，笑著回憶那些曾經以為平凡、如今卻再也回不去的日子。", "笑著笑著，眼眶會紅；那些沒有說出口的想念，早已安安靜靜地藏在每個人的心裡，我們還是那十幾個小孩，只是再也等不到阿嬤喊我們吃雞塊，也再也聽不到阿公說那些故事。原來，長大不是學會了多少事情，而是終於明白——有些人離開以後，童年也就跟著少了一個可以回去的地方。", "想念外婆的小孩們，依然記得那一盤炸雞塊，也依然記得，那個有阿公、有阿嬤、有十幾個孩子奔跑嬉鬧的家，那是我們的童年，也是我們這一生，再也回不去，卻永遠最想回去的地方。"]};

let currentTab = 'ALL';
let notesData = JSON.parse(localStorage.getItem('user_notes_data')) || initialDataset;

function renderNotes() {
  const container = document.getElementById('notesContainer');
  container.innerHTML = '';

  const categories = currentTab === 'ALL' ? Object.keys(notesData) : [currentTab];

  categories.forEach(cat => {
    if (!notesData[cat]) return;
    const section = document.createElement('section');
    section.style.marginBottom = '40px';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<h2 class="section-title">【${cat}】</h2><span style="font-size:0.9rem; color:var(--text-secondary);">共 ${notesData[cat].length} 則便簽</span>`;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'grid';

    notesData[cat].forEach((text, index) => {
      const card = document.createElement('div');
      card.className = 'note-card';

      card.innerHTML = `
        <div class="card-header">
          <span class="card-index">便簽 #${index + 1}</span>
          <div class="card-actions">
            <button class="mini-btn" title="刪除便簽" onclick="deleteCard('${cat}', ${index})">🗑️ 刪除</button>
          </div>
        </div>
        <div class="note-content" contenteditable="true" onblur="updateText('${cat}', ${index}, this.innerText)">${escapeHtml(text)}</div>
        <div class="seal-mark">藏</div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function updateText(cat, index, newText) {
  notesData[cat][index] = newText;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.innerText.includes(tab) || (tab === 'ALL' && btn.innerText.includes('全部')));
  });
  renderNotes();
}

function addNewCard() {
  const targetCat = currentTab === 'ALL' ? '創作(小品)' : currentTab;
  notesData[targetCat].unshift("點擊此處開始編寫新文字...");
  renderNotes();
  showStatus("已在【" + targetCat + "】新增便簽");
}

function deleteCard(cat, index) {
  if (confirm("確定要刪除這張便簽嗎？")) {
    notesData[cat].splice(index, 1);
    renderNotes();
    showStatus("便簽已刪除");
  }
}

function saveToLocalStorage() {
  localStorage.setItem('user_notes_data', JSON.stringify(notesData));
  showStatus("儲存成功！資料已儲存至瀏覽器");
}

function resetData() {
  if (confirm("確定要還原為原始 Excel 內的資料嗎？目前的修改將會覆蓋。")) {
    notesData = JSON.parse(JSON.stringify(initialDataset));
    localStorage.removeItem('user_notes_data');
    renderNotes();
    showStatus("已還原初始資料");
  }
}

function showStatus(msg) {
  const el = document.getElementById('statusMsg');
  el.innerText = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// 初始化渲染
renderNotes();
</script>
