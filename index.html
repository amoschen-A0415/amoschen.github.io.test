<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安得烈食物銀行 遊戲大觀園</title>
    <style>
        :root {
            --primary-yellow: #FFF8D9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-orange: #F56D2D;
            --accent-yellow: #FFD34E;
            --accent-green: #69B957;
            --accent-blue: #43B8E8;
            --text-dark: #2C3E50;
            --text-muted: #5A6B7C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 鎖定 100vh，全頁絕對禁止出現滾軸 */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
            background:
                radial-gradient(ellipse at 12% 12%, rgba(255,255,255,.85) 0 7%, transparent 8%),
                radial-gradient(ellipse at 90% 85%, rgba(190,229,151,.40) 0 12%, transparent 13%),
                linear-gradient(160deg, #BCEEFF 0%, #FFF8D9 52%, #EAF8D9 100%);
            color: var(--text-dark);
            position: relative;
        }

        /* 背景奔跑與飄浮卡通角色圖層 */
        .cartoon-bg-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .runner {
            position: absolute;
            font-size: 2.8rem;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.12));
            user-select: none;
            white-space: nowrap;
        }

        /* 1. 從左往右奔跑 (人物面朝右) */
        @keyframes runLeftToRight {
            0% { transform: translateX(-12vw) translateY(0) rotate(0deg); }
            50% { transform: translateX(50vw) translateY(-12px) rotate(6deg); }
            100% { transform: translateX(112vw) translateY(0) rotate(-6deg); }
        }

        /* 2. 從右往左奔跑 (人物面朝左) */
        @keyframes runRightToLeft {
            0% { transform: translateX(112vw) translateY(0) rotate(0deg); }
            50% { transform: translateX(50vw) translateY(-15px) rotate(-6deg); }
            100% { transform: translateX(-12vw) translateY(0) rotate(6deg); }
        }

        /* 3. 上下歡樂跳躍飄浮 */
        @keyframes bounceFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-16px) scale(1.1) rotate(8deg); }
        }

        .runner-l2r-1 { top: 2%; animation: runLeftToRight 14s linear infinite; }
        .runner-l2r-2 { bottom: 2%; animation: runLeftToRight 19s linear infinite 3s; }
        .runner-r2l-1 { top: 12%; animation: runRightToLeft 16s linear infinite 1s; }
        .runner-r2l-2 { bottom: 8%; animation: runRightToLeft 21s linear infinite 4s; }

        .floater-1 { top: 40%; left: 1.5%; animation: bounceFloat 3.2s ease-in-out infinite; font-size: 3rem; }
        .floater-2 { top: 45%; right: 1.5%; animation: bounceFloat 3.8s ease-in-out infinite 1s; font-size: 3.2rem; }
        .floater-3 { top: 18%; right: 3%; animation: bounceFloat 4.2s ease-in-out infinite 0.5s; font-size: 2.6rem; }
        .floater-4 { bottom: 18%; left: 3%; animation: bounceFloat 3.5s ease-in-out infinite 1.5s; font-size: 2.8rem; }

        /* 右上角音樂開關按鈕 */
        .audio-control-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 100;
            background: #FFFFFF;
            border: 3px solid #FF7E36;
            color: #FF5722;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .audio-control-btn:hover {
            transform: scale(1.08);
            background: #FFF3E0;
        }

        /* 主容器 (100vh 響應式佈局) */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0.8rem 1.8rem;
            justify-content: space-between;
        }

        /* 頁首 */
        header {
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 0.4rem;
        }

        /* 主標題：放大 50% (原 2.5rem -> 3.75rem) */
        header h1 {
            font-size: 3.75rem;
            font-weight: 900;
            color: #FF5722;
            text-shadow: 4px 4px 0px #FFE0B2, 7px 7px 0px rgba(0,0,0,0.05);
            letter-spacing: 2px;
            margin-bottom: 0.1rem;
            display: inline-block;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.85);
            display: inline-block;
            padding: 4px 22px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 5 格卡片佈局 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.1rem;
            flex-grow: 1;
            align-items: stretch;
            max-height: calc(100vh - 150px);
        }

        /* 卡片風格 */
        .game-card {
            background: var(--card-bg);
            border-radius: 22px;
            border: 4px solid #FFF;
            box-shadow: 0 10px 25px rgba(255, 126, 54, 0.12);
            padding: 0.8rem 0.7rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 16px 32px rgba(255, 87, 34, 0.22);
            border-color: #FFE082;
        }

        .game-icon-wrapper {
            width: min(100%, 180px);
            height: clamp(105px, 20vh, 180px);
            background: linear-gradient(145deg, #FFF9D7 0%, #FFE9A4 100%);
            border: 3px solid #FFF;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.45rem;
            box-shadow: inset 0 -4px 0 rgba(130,83,19,0.08), 0 7px 14px rgba(125,91,39,0.12);
            transition: transform 0.3s ease;
            flex-shrink: 0;
            overflow: hidden;
        }
        .game-icon-art {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 17px;
        }

        .game-card:hover .game-icon-wrapper {
            transform: rotate(10deg) scale(1.08);
        }

        .game-icon {
            font-size: 2.5rem;
        }

        /* 遊戲名稱：放大 50% */
        .game-title {
            font-size: 1.95rem;
            font-weight: 900;
            color: #2C3E50;
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }

        /* 卡片說明文字：放大 100% */
        .game-desc {
            font-size: 1.7rem;
            color: #455A64;
            line-height: 1.3;
            font-weight: 800;
            margin-bottom: 0.5rem;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 按鈕風格 */
        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .btn {
            width: 100%;
            padding: 0.55rem 0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF7E36 0%, #FF5722 100%);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #FF914D 0%, #FF6E40 100%);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #E0F2FE;
            color: #0284C7;
        }

        .btn-secondary:hover {
            background: #BAE6FD;
            color: #0369A1;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(2px) !important;
            box-shadow: 0 2px 0 rgba(0,0,0,0.12) !important;
        }

        /* 頁尾 */
        footer {
            text-align: center;
            flex-shrink: 0;
            padding-top: 0.2rem;
            font-size: 0.9rem;
            font-weight: 800;
            color: #78909C;
        }

        /* 彈窗 Modal (全無滾軸設計) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(44, 62, 80, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: #FFFFFF;
            border: 6px solid #FFB74D;
            width: 94%;
            max-width: 960px;
            border-radius: 28px;
            padding: 1.6rem 2.2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            transform: scale(0.85);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden !important;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px dashed #FFE082;
            padding-bottom: 0.6rem;
            margin-bottom: 1rem;
        }

        .modal-header h2 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #E65100;
        }

        .close-btn {
            background: #FFEBEE;
            border: none;
            color: #EF5350;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #FFCDD2;
            transform: scale(1.1);
        }

        /* 說明內容：文字放大 100% 超清晰排版 */
        .modal-body {
            overflow: hidden !important;
            color: #2C3E50;
        }

        .modal-grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .modal-box {
            background: #FFFDE7;
            border: 3px solid #FFE082;
            border-radius: 18px;
            padding: 1.2rem;
        }

        .section-title {
            color: #D84315;
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .info-list {
            list-style: none;
            padding-left: 0.2rem;
        }

        .info-list li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 0.6rem;
            font-size: 1.75rem;
            font-weight: 800;
            line-height: 1.4;
            color: #263238;
        }

        .info-list li::before {
            content: "★";
            position: absolute;
            left: 0;
            color: #FF9800;
            font-size: 1.6rem;
        }

        .highlight {
            color: #D84315;
            font-weight: 900;
            background: #FFE0B2;
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* 響應式微調 */
        @media (max-width: 1280px) {
            header h1 { font-size: 2.8rem; }
            .game-title { font-size: 1.5rem; }
            .game-desc { font-size: 1.25rem; }
        }
        @media (max-width: 1024px) {
            .game-grid { grid-template-columns: repeat(3, 1fr); }
            .modal-grid-layout { grid-template-columns: 1fr; }
            .info-list li { font-size: 1.3rem; }
            .section-title { font-size: 1.4rem; }
        }
        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .animal-decoration {
            position: absolute;
            width: clamp(88px, 11vw, 170px);
            opacity: .92;
            filter: drop-shadow(0 8px 8px rgba(87, 105, 65, .12));
            animation: bounceFloat 4s ease-in-out infinite;
            border-radius: 30px;
            mix-blend-mode: multiply;
        }
        .animal-left { top: 7%; left: 1.5%; transform: rotate(-8deg); }
        .animal-right { right: 1.5%; bottom: 5%; transform: scaleX(-1) rotate(7deg); animation-delay: 1.1s; }
        header h1 {
            color: #F36B24;
            text-shadow: 0 3px 0 #FFF, 0 7px 0 #FFE0A3, 0 10px 18px rgba(126,77,28,.12);
        }
        header p {
            border: 2px solid rgba(255,255,255,.95);
            background: rgba(255,255,255,.82);
            color: #5B6B55;
        }
        .game-title { color: #385448; }
        .game-desc { color: #586A60; }
        .modal-container {
            background: linear-gradient(180deg, #FFFEF7, #FFF8E5);
            border-color: #FFC65A;
            box-shadow: 0 25px 50px rgba(106, 91, 49, .24);
        }
        @media (max-width: 900px) {
            html, body { height: auto; min-height: 100%; overflow: auto !important; }
            .app-container { height: auto; min-height: 100vh; gap: 1rem; padding: 1rem; }
            .game-grid { max-height: none; }
            .animal-decoration { opacity: .24; }
            header h1 { font-size: clamp(1.8rem, 5vw, 3rem); }
            .game-title { font-size: clamp(1.2rem, 2.5vw, 1.8rem); }
            .game-desc { font-size: clamp(1rem, 2vw, 1.35rem); }
        }
\n    </style>
</head>

    <script>
        // Web Audio API 自動輕快音樂合成器
        let audioCtx = null;
        let isMuted = false;
        let bgmTimer = null;

        const melodyNotes = [
            261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
            293.66, 349.23, 440.00, 587.33, 440.00, 349.23,
            329.63, 392.00, 523.25, 659.25, 523.25, 392.00,
            392.00, 440.00, 493.88, 523.25, 587.33, 659.25
        ];

        let noteIdx = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startBGM();
            }
        }

        function playNote(freq, duration, type = 'sine', gainVal = 0.05) {
            if (!audioCtx || isMuted) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function startBGM() {
            if (bgmTimer) clearInterval(bgmTimer);
            bgmTimer = setInterval(() => {
                if (!isMuted) {
                    playNote(melodyNotes[noteIdx], 0.25, 'triangle', 0.04);
                    noteIdx = (noteIdx + 1) % melodyNotes.length;
                }
            }, 300);
        }

        function toggleAudio() {
            initAudio();
            isMuted = !isMuted;
            const btn = document.getElementById('audioBtn');
            if (isMuted) {
                btn.innerText = "🔇 背景音樂：靜音";
                btn.style.borderColor = "#90A4AE";
                btn.style.color = "#546E7A";
            } else {
                btn.innerText = "🎵 背景音樂：開啟";
                btn.style.borderColor = "#FF7E36";
                btn.style.color = "#FF5722";
                playClickSound();
            }
        }

        function playClickSound() {
            initAudio();
            playNote(523.25, 0.1, 'sine', 0.08);
            setTimeout(() => playNote(659.25, 0.12, 'sine', 0.08), 50);
        }

                            <div class="section-title">💯 得分機制</div>
                            <ul class="info-list">
                                <li>正確物資：接住良好物資 <span class="highlight">+2 分</span></li>
                                <li>不合適物資：接住壞物資 <span class="highlight">-1 分</span></li>
                            </ul>
                        </div>
                        <div class="modal-box">
                            <div class="section-title">⚡ 閃電加速翻倍</div>
                            <ul class="info-list">
                                <li>接住閃電符號物資會提升下降速度！</li>
                                <li>速度每加快 <span class="highlight">20%</span>，得分進行 <span class="highlight">翻倍計算</span>！</li>

            },
            game05: {
                title: "🧠 智慧大挑戰 - 遊戲規則與秘笈",
                content: `
                    <div class="modal-grid-layout">
                        <div class="modal-box">
                            <div class="section-title">🧒 專屬對象</div>
                            <ul class="info-list">
                                <li>專為 <span class="highlight">國小學童</span> 設計的宣導遊戲。</li>
                                <li>線上題目結合實體動作互動。</li>
                            </ul>
                        </div>
                        <div class="modal-box">
                            <div class="section-title">🚩 現場紅綠站隊</div>
                            <ul class="info-list">
                                <li>採用 <span class="highlight">紅綠現場站隊</span> 的互動方式。</li>
                                <li>學員看題後選擇站至「紅區」或「綠區」開獎！</li>
                            </ul>
                        </div>
                    </div>
                `
            }
        };

        function openModal(gameKey) {
            const data = gameRules[gameKey];
            if (data) {
                document.getElementById('modalTitle').innerText = data.title;
                document.getElementById('modalContent').innerHTML = data.content;
                document.getElementById('modalOverlay').classList.add('active');
            }
        }

        function closeModal() {
            playClickSound();
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnOverlay(event) {
            if (event.target.id === 'modalOverlay') {
                closeModal();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
