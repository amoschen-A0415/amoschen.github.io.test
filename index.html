<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>寶貝的 3D 動畫幸福庭園</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #1a1626;
      color: #fff;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.5rem; color: #ffd88a; margin-bottom: 6px; }
    p { font-size: 0.88rem; color: #d6cde0; margin-bottom: 12px; }

    .stage-wrapper {
      position: relative;
      width: 100%;
      max-width: 680px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(255, 216, 138, 0.3);
    }

    #bgImg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #threeCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      cursor: pointer;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      background: linear-gradient(180deg, #ffdf9e 0%, #f5b95b 100%);
      color: #4a280a;
      border: none;
      padding: 9px 18px;
      border-radius: 999px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <!-- 引入 Three.js 與 GLTFLoader（載入真實 3D 動畫模型） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <h1>🐾 寶貝的 3D 動畫幸福庭園 🧧</h1>
  <p>點擊草地任意處，寶貝就會跑過去；網頁開著也會自動散步與休息</p>

  <div class="stage-wrapper" id="stage">
    <!-- 步驟一產生的乾淨背景圖 -->
    <img id="bgImg" src="garden_bg.jpg" alt="庭園背景" />
    <canvas id="threeCanvas"></canvas>
  </div>

  <div class="controls">
    <button onclick="switchAction('walk')">🐾 自由散步</button>
    <button onclick="switchAction('rest')">💤 趴下休息</button>
  </div>

  <script>
    const canvas = document.getElementById("threeCanvas");
    const scene = new THREE.Scene();

    // 對齊庭園照片的透視視角
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.set(0, 8.2, 11.2);
    camera.lookAt(0, 0.4, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(680, 680);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;

    // 黃昏暖光照明
    scene.add(new THREE.AmbientLight(0xfff4e0, 1.1));
    const dirLight = new THREE.DirectionalLight(0xffdfb0, 1.1);
    dirLight.position.set(-4, 10, 6);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 接收腳底陰影的透明地板
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.ShadowMaterial({ opacity: 0.38 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    let dogModel = null;
    let mixer = null;
    let actions = {};
    let activeAction = null;
    let mode = "walk";
    let targetPos = new THREE.Vector3(0.5, 0, 1.2);

    const spots = [
      new THREE.Vector3(0.2, 0, 1.6),
      new THREE.Vector3(2.3, 0, 0.7),
      new THREE.Vector3(3.0, 0, -0.5),
      new THREE.Vector3(1.1, 0, -1.3),
      new THREE.Vector3(-1.3, 0, 1.6)
    ];

    // 載入 Tripo3D / Meshy 生成的 baby_dog.glb 模型
    const loader = new THREE.GLTFLoader();
    loader.load("baby_dog.glb", (gltf) => {
      dogModel = gltf.scene;

      // 自動正規化模型大小與腳底貼地
      const box = new THREE.Box3().setFromObject(dogModel);
      const size = box.getSize(new THREE.Vector3());
      const scale = 1.45 / Math.max(size.x, size.y, size.z);
      dogModel.scale.setScalar(scale);

      const center = box.getCenter(new THREE.Vector3());
      dogModel.position.set(0, -box.min.y * scale, 0);

      dogModel.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(dogModel);

      // 綁定模型內建動畫（奔跑 / 待機休息）
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(dogModel);
        gltf.animations.forEach((clip) => {
          const name = clip.name.toLowerCase();
          if (name.includes("run") || name.includes("walk")) {
            actions.walk = mixer.clipAction(clip);
          } else {
            actions.rest = mixer.clipAction(clip);
          }
        });
        if (!actions.walk) actions.walk = mixer.clipAction(gltf.animations[0]);
        if (!actions.rest) actions.rest = mixer.clipAction(gltf.animations[gltf.animations.length - 1]);
        playClip(actions.walk);
      }
    });

    function playClip(nextClip) {
      if (!nextClip || activeAction === nextClip) return;
      if (activeAction) activeAction.fadeOut(0.3);
      nextClip.reset().fadeIn(0.3).play();
      activeAction = nextClip;
    }

    function switchAction(newMode) {
      mode = newMode;
      if (newMode === "walk") {
        targetPos.copy(spots[Math.floor(Math.random() * spots.length)]);
        playClip(actions.walk);
      } else {
        playClip(actions.rest);
      }
    }

    // 點擊草地讓寶貝跑過去
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(ground);
      if (hits.length > 0) {
        targetPos.x = Math.max(-2.4, Math.min(3.3, hits[0].point.x));
        targetPos.z = Math.max(-1.6, Math.min(2.2, hits[0].point.z));
        mode = "walk";
        playClip(actions.walk);
      }
    });

    // 自動循環：散步與休息切換
    setInterval(() => {
      if (Math.random() < 0.65) {
        switchAction("walk");
      } else {
        switchAction("rest");
      }
    }, 6500);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);

      if (dogModel && mode === "walk") {
        const dir = new THREE.Vector3().subVectors(targetPos, dogModel.position);
        dir.y = 0;
        if (dir.length() > 0.15) {
          const angle = Math.atan2(dir.x, dir.z);
          dogModel.rotation.y += (angle - dogModel.rotation.y) * 0.12;
          dir.normalize();
          dogModel.position.addScaledVector(dir, dt * 1.6);
          playClip(actions.walk);
        } else {
          playClip(actions.rest);
        }
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
