<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安得烈食物銀行惜食大富翁</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS & QRCode.js -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chch: {
                            green: '#2e7d32',      /* 安得烈綠 */
                            darkGreen: '#1b5e20',
                            lightGreen: '#f1f8e9',
                            orange: '#f57c00',     /* 溫暖橘 */
                            lightOrange: '#fff3e0',
                            yellow: '#fbc02d',
                            red: '#d32f2f',
                            warmBg: '#fefce8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 100%);
            color: #1e293b;
            user-select: none;
            overflow: hidden;
        }

        * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        #qrcode canvas, #qrcode img {
            margin: 0 auto;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .music-speed-btn {
            background-color: #ffffff;
            color: #d97706;
            border: 2px solid #fcd34d;
            transition: all 0.2s ease;
        }
        .music-speed-btn:hover {
            background-color: #fef3c7;
            color: #b45309;
        }
        .music-speed-btn.active {
            background-color: #f59e0b;
            color: #ffffff;
            border-color: #d97706;
            box-shadow: 0 2px 4px rgba(217, 119, 6, 0.2);
        }

        /* 號碼球被撞擊放大再大一倍並停住 1 秒動畫 */
        @keyframes ball-hit-freeze {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
            30% { transform: scale(2.8); filter: drop-shadow(0 0 25px rgba(245, 158, 11, 1)); }
            80% { transform: scale(2.8); filter: drop-shadow(0 0 30px rgba(239, 68, 68, 1)); opacity: 1; }
            100% { transform: scale(3.5); opacity: 0; }
        }
        .animate-ball-freeze-explode {
            animation: ball-hit-freeze 1.0s ease-out forwards;
            z-index: 50 !important;
        }

        /* 超大皇冠閃耀旋轉動畫 */
        @keyframes crown-shimmer-vibrate {
            0% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.9)); }
            25% { transform: scale(1.1) rotate(5deg); filter: drop-shadow(0 0 30px rgba(245, 158, 11, 1)); }
            50% { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.9)); }
            75% { transform: scale(1.12) rotate(4deg); filter: drop-shadow(0 0 35px rgba(245, 158, 11, 1)); }
            100% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.9)); }
        }
        .animate-super-crown {
            animation: crown-shimmer-vibrate 2s infinite ease-in-out;
        }

        /* 加分文字爆破動畫 */
        @keyframes score-explode-vibrate {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            40% { transform: scale(1.3) rotate(5deg); opacity: 1; }
            60% { transform: scale(0.95) rotate(-3deg); }
            70% { transform: scale(1.1) rotate(2deg); }
            80% { transform: scale(0.98) rotate(-1deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .animate-score-explode {
            animation: score-explode-vibrate 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes score-continuous-vibrate {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.08) rotate(-3deg); }
            50% { transform: scale(0.95) rotate(3deg); }
            75% { transform: scale(1.05) rotate(-2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .animate-vibrate-score {
            animation: score-continuous-vibrate 0.3s infinite;
        }

        /* 交換位置時頭像放大縮小閃爍歷時 3 秒 (z-index: 100) */
        @keyframes exchange-pulse-3sec {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
            16.6% { transform: scale(2.5); filter: drop-shadow(0 0 20px #f59e0b); }
            33.3% { transform: scale(0.6); }
            50% { transform: scale(2.5); filter: drop-shadow(0 0 25px #ef4444); }
            66.6% { transform: scale(0.6); }
            83.3% { transform: scale(2.5); filter: drop-shadow(0 0 25px #10b981); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
        }
        .animate-exchange-bounce {
            animation: exchange-pulse-3sec 3.0s ease-in-out forwards;
            z-index: 100 !important;
            position: relative;
        }

        #main-header { background:linear-gradient(90deg,#fff2c7,#f7d48d,#fff0c0)!important; border-bottom:4px solid #d99a43!important; }
        #main-header h1 { color:#70401b!important; text-shadow:0 2px #fff3c9; }
        #view-lobby { background:rgba(255,249,224,.96)!important; border:5px solid #e9b65e!important; border-radius:30px!important; box-shadow:0 10px 0 rgba(133,88,31,.18),0 20px 50px #5e7d3d55!important; }
        #qrcode { border:5px solid #e7b45a!important; }
        #btn-start-game { background:linear-gradient(#ffdb67,#f2a82c,#d98516)!important; color:#713d10!important; border:3px solid #fff0b3!important; text-shadow:0 1px #fff4c5; }
        #view-game { background:transparent!important; }
        #view-game > div:first-child { background:rgba(255,247,215,.96)!important; border:4px solid #dca452!important; border-radius:22px!important; }
        #view-game > div:nth-child(2) { background:rgba(255,248,221,.88)!important; border:4px solid #dca452!important; border-radius:22px!important; padding:10px!important; }
        #center-board-area { background:rgba(255,248,224,.97)!important; border:4px solid #e2b35b!important; }
        #center-ball-container { background:linear-gradient(135deg,#e1f2d0,#d3e8f5)!important; }
        .map-tile-grid { background:#fff4cf!important; border:3px solid #e6b55a!important; border-radius:15px!important; box-shadow:0 3px 0 #c98b3d,0 5px 10px #68401d22!important; padding:0!important; overflow:hidden!important; isolation:isolate; }
        .map-tile-grid > div:first-child { position:absolute!important; inset:0!important; flex-direction:column!important; gap:0!important; padding:0!important; overflow:hidden!important; }
        .map-tile-grid .tile-art { width:100%!important; height:100%!important; object-fit:fill!important; filter:none!important; border-radius:10px; }
        .map-tile-grid .tile-title { display:none!important; }
        .map-tile-grid .tile-art { width:clamp(34px,4.2vw,66px); height:clamp(34px,4.2vw,66px); object-fit:contain; filter:drop-shadow(0 2px 1px #80501b22); }
        .map-tile-grid .tile-title { font-size:clamp(11px,1.35vw,21px)!important; color:#71411e!important; line-height:1.08!important; }
        .map-tile-grid[data-kind="起點"] { background:linear-gradient(145deg,#e8f4c8,#a9d777)!important; }
        .map-tile-grid[data-kind="休息"] { background:linear-gradient(145deg,#e3f5dc,#c7e7c0)!important; }
        .map-tile-grid[data-kind="命運"], .map-tile-grid[data-kind="機會"] { background:linear-gradient(145deg,#dcefff,#b4ddf7)!important; }
        #players-dashboard > div { border-radius:14px!important; border-color:#e6c27c!important; background:#fff9e8!important; }
        #game-goal-box { background:linear-gradient(145deg,#fff4c9,#ffe2a0)!important; border-color:#e5b65c!important; }
        #view-result > div { background:#fff5d6!important; border-color:#e5b35b!important; }
        .avatar-art { display:inline-block; object-fit:contain; vertical-align:middle; border-radius:50%; background:#fff3cc; border:2px solid #f1d17d; box-shadow:0 2px 5px #75451c22; }
        .avatar-art-sm { width:1.6em;height:1.6em; }
        .avatar-art-md { width:2.1em;height:2.1em; }
        .avatar-art-lg { width:1.2em;height:1.2em; }
        #avatar-select-grid .avatar-art { width:min(18vw,84px);height:min(18vw,84px); }
        .avatar-option-btn { background:linear-gradient(#fffdf0,#ffe9b5)!important; border-color:#e7bd6c!important; }
        #mobile-half-display { background:linear-gradient(#fff4c7,#d9efc7)!important; border-color:#d9a14c!important; }
        #mobile-controls-area { border-color:#d9a14c!important; }
        @media (max-width: 900px) {
          #view-game { display:none!important; }

<body class="h-screen w-screen flex flex-col justify-between overflow-hidden bg-chch-lightGreen">

    <!-- 背景音樂：Two_Coins_Left.mp3 -->
    <audio id="bgm" loop preload="auto" src="Two_Coins_Left.mp3"></audio>

    <!-- 頂部 Header -->
    <header id="main-header" class="w-full px-6 py-3 border-b border-chch-green/20 bg-white/95 backdrop-blur-md flex justify-between items-center z-10 flex-shrink-0 shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🍲</span>
            <h1 class="text-2xl md:text-3xl font-black tracking-wider text-chch-darkGreen">
                安得烈食物銀行惜食大富翁
            </h1>
        </div>
        <div class="flex items-center gap-3" aria-hidden="true"></div>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-grow flex items-center justify-center p-2 md:p-4 relative overflow-hidden">

        <!-- 大螢幕 - 遊戲大廳 / 掃碼進入 -->
        <div id="view-lobby" class="w-full max-w-[96vw] h-full max-h-[90vh] bg-white/95 border-2 border-chch-green/30 rounded-3xl p-4 md:p-6 shadow-xl backdrop-blur-xl relative flex flex-col justify-between overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center h-full">
                
                <!-- 左側：QR Code (惜食大富翁專屬線上動態PeerJS QR碼) -->
                <div id="qr-lobby-stage" class="md:col-span-6 lg:col-span-7 relative flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-chch-green/20 pr-0 md:pr-6 pb-2 md:pb-0 text-center h-full overflow-visible">
                    <div class="qr-code-card p-5 bg-gradient-to-br from-chch-green via-emerald-600 to-chch-darkGreen rounded-3xl shadow-lg my-auto transition-transform duration-300 border-2 border-white relative z-10">
                        <div id="qrcode" class="bg-white p-4 rounded-2xl border-2 border-emerald-100 flex items-center justify-center shadow-inner"></div>
                    </div>
                    <div id="qr-player-ring" aria-live="polite" aria-label="已連線參賽者" class="absolute inset-0 pointer-events-none"></div>
                </div>

                <!-- 右側：玩家名單 & 設定選項 & 開始按鈕 -->
                <div class="md:col-span-6 lg:col-span-5 flex flex-col justify-between h-full overflow-hidden pl-0 md:pl-2">
                    <div class="flex-grow flex flex-col overflow-hidden">
                        <h2 class="text-2xl md:text-3xl font-bold text-chch-darkGreen mb-4 flex items-center justify-between flex-shrink-0">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-users"></i> 參賽者名單 (至多4位)</span>
                            <span id="player-count-badge" class="text-xl bg-chch-lightGreen text-chch-darkGreen px-4 py-1.5 rounded-full font-black border border-chch-green/30 shadow-sm
