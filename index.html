<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古典雅集</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap');

  :root {
    --bg-color: #f4efe6;
    --paper-color: #fcf8f2;
    --border-color: #8c2d19;
    --text-primary: #2c221e;
    --text-secondary: #5c4b43;
    --accent-red: #9e2a2b;
    --accent-gold: #c68b59;
    --btn-hover: #722314;
    --shadow: 0 4px 15px rgba(0,0,0,0.08);
  }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(#e5dbc9 1px, transparent 0);
    background-size: 24px 24px;
    color: var(--text-primary);
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    margin: 0;
    padding: 30px 15px 60px 15px;
    line-height: 1.8;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 25px;
    position: relative;
    padding-bottom: 15px;
    border-bottom: 1px dashed var(--accent-gold);
  }

  header h1 {
    font-size: 2.5rem;
    color: var(--accent-red);
    letter-spacing: 6px;
    margin: 0 0 8px 0;
    font-weight: 700;
  }

  .control-panel {
    background: #eae2d3;
    border: 1px solid var(--accent-gold);
    border-radius: 6px;
    padding: 15px 20px;
    margin-bottom: 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.05);
  }

  .nav-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .tab-btn {
    background: var(--paper-color);
    border: 1px solid var(--border-color);
    color: var(--border-color);
    padding: 8px 16px;
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
  }

  .tab-btn:hover, .tab-btn.active {
    background: var(--border-color);
    color: #fff;
  }

  .action-btns {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    background: var(--accent-red);
    color: #fff;
    border: none;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 0.9rem;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.2s;
  }

  .btn:hover { background: var(--btn-hover); }

  .btn-gold { background: var(--accent-gold); }
  .btn-gold:hover { background: #a87143; }

  .btn-reset {
    background: transparent;
    border: 1px solid #c8bba8;
    color: #88766a;
    font-size: 0.8rem;
    padding: 5px 10px;
  }
  .btn-reset:hover {
    background: #dcd0bc;
    color: var(--accent-red);
    border-color: var(--accent-red);
  }

  .status-msg {
    font-size: 0.88rem;
    color: var(--accent-red);
    margin-left: 8px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .status-msg.show { opacity: 1; }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
    margin-top: 20px;
    margin-bottom: 25px;
  }

  .section-title {
    font-size: 1.5rem;
    color: var(--border-color);
    letter-spacing: 2px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .category-ops {
    display: inline-flex;
    gap: 5px;
    margin-left: 10px;
  }

  .cat-op-btn {
    background: transparent;
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    border-radius: 3px;
    font-size: 0.75rem;
    padding: 2px 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-op-btn:hover {
    background: var(--accent-gold);
    color: #fff;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 22px;
  }

  .note-card {
    background: var(--paper-color);
    border: 1px solid #e0d5c1;
    border-top: 4px solid var(--border-color);
    border-radius: 4px;
    padding: 20px;
    box-shadow: var(--shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .note-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px dashed #dcd1be;
    padding-bottom: 6px;
  }

  .card-index {
    font-size: 0.82rem;
    color: var(--accent-gold);
    font-weight: 600;
    letter-spacing: 1px;
  }

  .card-actions {
    display: flex;
    gap: 6px;
  }

  .mini-btn {
    background: #eae2d3;
    border: 1px solid #c8bba8;
    color: var(--text-primary);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    padding: 3px 8px;
    border-radius: 3px;
    transition: all 0.2s;
  }
  .mini-btn:hover {
    background: var(--border-color);
    color: #fff;
    border-color: var(--border-color);
  }
  .mini-btn-save {
    background: var(--accent-red);
    color: #fff;
    border-color: var(--accent-red);
  }
  .mini-btn-save:hover { background: var(--btn-hover); }

  .note-content {
    font-size: 0.98rem;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
    outline: none;
    min-height: 80px;
    padding: 8px;
    border: 1px transparent dashed;
    border-radius: 3px;
    transition: all 0.2s;
  }

  .note-content.editing {
    border-color: var(--accent-gold);
    background: #fffdfa;
    box-shadow: inset 0 0 5px rgba(198,139,89,0.2);
  }

  .card-footer {
    margin-top: 15px;
    padding-top: 8px;
    border-top: 1px dashed #e8ded0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-timestamp {
    font-size: 0.78rem;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }

  .seal-mark {
    width: 24px;
    height: 24px;
    border: 1px solid var(--accent-red);
    color: var(--accent-red);
    font-size: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    opacity: 0.35;
    pointer-events: none;
  }

  footer {
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px dashed #dcd1be;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>古典雅集</h1>
  </header>

  <div class="control-panel">
    <div class="nav-tabs" id="categoryTabs"></div>
    <div class="action-btns">
      <button class="btn btn-gold" onclick="addNewCategory()">📁 增加分類</button>
      <button class="btn btn-gold" onclick="addNewCard()">➕ 新建便簽</button>
      <span id="statusMsg" class="status-msg">已存檔！</span>
    </div>
  </div>

  <main id="notesContainer"></main>

  <footer>
    <span>古典雅集 電子便簽系統</span>
    <button class="btn btn-reset" onclick="resetData()">🔄 還原初始</button>
  </footer>
</div>

  "創作(新詩)": [
    "且聽雨聲打穿林，\n何不徐行待嘯吟。\n竹杖芒鞋意輕馬，更勝？\n一曲瀟瀟縱千行，\n斜絲落雨打罄滿，\n不覺，日夕迎暉映渡波，\n回首蕭瑟向來去，\n來去，一者風雨二者晴\n正肅  定風波",
    "瀟瀟..夜雨.徐徐\n..濛濛.心湖..戚戚\n幽幽.身影..踽踽\n亂啊!......亂漪漣",
    "絮，飄落的天使羽翼；\n沉静，悄悄祈禱的耳語；\n耶和華的祝福，\n澤披每個仰望祂的兒女～\n宛若，新生。",
    "映入心湖的女孩，\n清晰的浮顯在記憶的沙洲，\n那一抹清麗的背影，\n伴隨著漸行漸遠的模糊；\n曳洒指縫的繾綣，\n是唯一牽絆著女孩的思念；\n我不曾離開，\n只是逐漸被女孩遺忘。",
    "沁涼的夏夜，編織了多少的夢，\n牽動青澀的回憶，那繾綣髮鬢的相思；\n風獅爺訴說著金門的淡淡哀愁，\n抑或，候鳥的回歸帶著過客的思念；\n這惹人的愁，是金門的歷史，\n還是那段夏天的未竟之憾…",
    "春蠶到死絲方盡，?炬成灰淚始乾。\n這美，美得讓人沉醉；\n獨自一個人，並不是愛上孤獨，\n而是未能找著，那一縷與自己相契合的靈魂。\nBy 正肅",
    "我沉默在夜裡，等待黎明的降臨，\n斜倚著窗櫺，遠眺著辰星；\n那花前月下的欲飲瓊漿，那搖曳生姿的婀娜身段，\n那僅僅微不足道的我，伴隨著幻夢般的懷念；\n我將想念托付給了耶和華，祈求著能將思念傾訴在枕邊，\n是啊！我那天上的父，她的我在這，而我的她在哪呢?", "等候著耶和華引領她前來，見證從前的修剪不是偶然，\n是父神要預備我，成就基督靈裡的婚姻，\n我筆下的璀璨是為了見證主耶穌的大能，為要記錄我化為見證的歷程，\n我知道，一切都在耶和華的意旨中被安排著，\n因著愛而擁有選擇的我，在成就父神悅納的同時，\n也必將完整我被創造的真實樣貌。", "此刻，靜默的等待著；\n廳裡熙來訪往的人們，透露出假日的悠閒，微笑如原野的蝴蝶，洋溢在彼此的嘴角；", "未曾寫完的寄情詩在筆端鼓噪，被擱置的文房四寶悸動著，不曾枯乾的思念泉湧著，等待揮舞筆墨的時刻到來。", "晴空霹靂，這突如其來的聲響劃破天際，彷彿天裂開了般，我倚窗揣著書，癡癡望著天空，放空的思緒牽動記憶裡女孩的笑容，甜甜地在心湖醞釀著。", "思緒再化為思念，悄悄地隨蝶舞停佇在時間的末梢，一段又一段的流沙似金，彼此銜接著，情意綿綿的被帶走了；錐心刺股的也被帶走了；卻留下意猶未盡的彼此，品嚐著回憶的百味雜陳，而生命被應許的諸多恩典，在歲月流逝中被逐一彰顯，人生旅途的瑰怪崎麗，成就了上帝手中獨一無二的藝術品。", "湖心亭畔.夜沁如霜..\n月娘展顏.凝脂若水....\n湖心亭畔盼心湖.心湖漪漣惹心醉..\n曳灑酸楚幾多愁.古來相伴皆寂寞....", "一滴淚.泛起了悠悠心湖的漣漪.淺淺的憂鬱.是詩人心底的足跡~淡淡的哀愁.是舖陳七夕的序曲......洗淨鉛華的脫俗.悄悄的在心湖湧現.平靜依舊~多惹了歲月的激情.在這鵲橋的兩端......我不是過橋的人.我只是個過客~七夕情.兩端戲.郎情妾意倆相遇;獨一人.心一橫.橋下不妨看場戲......七夕.祝有情人終成眷屬.祝無情人各奔所屬~^__________^", "狂野.殘暴的撕裂著靈魂..極盡能事的毀壞著.在存在與虛無間恣意....光怪陸離的一切.吞噬著僅有的青春..肆無忌憚的予取予求....我.僅存著佝僂之軀.一圖在洪荒歲月裡力挽狂瀾....時也.命也.運也~非我之不能也", "沈默.是一場無止盡的戰爭..瘋狂.是刹那間被錯置的真實;恐懼.是交錯的內心中唯一的自我..黑夜.是伴隨著月色的協奏曲.而.沈默..依然是一場無止盡的戰爭..而已", "搖曳著燭光的夜..伴隨著欲拒還迎的羞澀光影\n在灑落一地的月光中..悄悄地啜了口紅酒\n放暖的花兒......燦爛的光舞在燭台上\n輕舞浪漫的..正訴說著在父神懷中的喜樂\n與結縭將一世永恆的她..", "窗外的雨.透過聲音的暈染..\n顯示出她的哀愁......", "雨.又在心湖上造次了..\n她用淚洗淨塵埃.卻去不了~\n刻骨銘心的失落......", "夢..憶起過去的足跡;\n..風.吹動往昔的浪漫~\n幽幽夜裡的點滴纏綿..夢醒時分的迷濛淚眼\n......驚醒湖畔流浪的詩人靈魂~", "寄情湖畔記情詩.寄情詩裡記情史\n寄情史裡訴記情.又復情湖訴情詩\n<<八九寄情>>正肅\n八九年記.人生不如意十常八九\n唯寄情一二..寥以慰之", "冬幕時節.瑞雪悄悄揭開序幕..聖誕鈴聲響起~敲響\n祝福到來的訊息..昭然若揭的思念~伴隨者柳絮般\n的輕柔樂章.在優雅麋鹿翩然起舞下..感染了節慶的\n氛圍~聖誕......是想念的季節.我在遙遠的彼方..\n獻上給女孩的祝福..欣賞妳的美貌~那是應許存在的\n唯一..聖誕快樂.給一個女孩.在我心湖畔的小均"

  "創作(散文)": [
    "6月19日23點53分\n一封突如其來的簡訊..\n告訴了我..原來二十年了\n我一直以為不會那麼快......一直以為\n小白......\n二十年前..外公帶牠進了我們這大家族\n初來乍到的牠.顯得生澀害羞\n但很快的..牠成了這大家族的一員\n活潑.熱情..有個性....\n媽媽對小妹說:琳琳.妳忘了妳小時候硬要拖小白跟妳走了嗎?\n大家笑了笑......揶揄了一下\n沒想到那麼快..我一直以為還有時間去看牠\n~在牠將去見外公時......\n不知道能否為我捎個信..",
    "沒有我之前.妳過得一樣好;有了我之後.也沒改變什麼..\n我似一葉落在湖面的肩舟.驚鴻一瞥中現了蹤跡..\n卻又悄悄的在歲月的洪流中消失......\n妳說懂我的孤寂.卻難以解開這千古未解的結;\n我也懂妳的信任.妳是相信..我曾經訴說過未來的承諾的吧!?\n上天不輕易的告訴我終點..但她的存在不是終點\n~而是生命的起點......\n時間是手指縫中留不住的沙.妳是曾經予了我夢想的天使..\n我渴望被救贖.在妳呢喃的仙樂飄飄裡~我再一次的相信了我對未來的憧憬......\n牧童.催促著佇足流水的牛兒走了\n~葉的飄落.是風的追求?還是樹的不挽留......\n我將思念遙寄遠方.卻猶豫著還能相信著天使的存在嗎!?\n躊躇不定..又得在人生路上耽擱了\n~時光荏苒.何處是我家?縱能一笑.也難忍踽踽歸途......",
    "十餘年的文哲創作..十餘年的旅遊回憶....十餘年的歷歷往事......十餘年的莞爾伊人........十餘年的老友通訊..........十餘年的~都在那一瞬間消失了..僅存~在我腦海裡的片段~與隻字片語..像是存在與虛無的瞬時轉換~我的隨身碟伴隨著我所有的資料..以及過不去的過去~都一併走遠了......風淡風輕的虛無~我懷疑著存在的可能....懷疑著",
    "紅色的季節..醉人的丰姿~演示著桃李般的美貌..妳的桃花世界\n尾冬的藍白~如妳清麗婉約的嶄新..俏麗的迎接~即將的初春\n笑靨似花~妳像暖春中迎接的喜悅..純真的自然 ~在大地的懷抱\n懷念的舊昔時光~是逝去的永恆美麗..猶如妳的韻味那般眷永無二~\n邂逅的夢醒時分~與妳擦肩而過的許久..多年後~是否會再想起..這多愁善感的五月\n脫俗的氣質~出落大方的高雅.曳灑在枝葉的陽光~也因妳..黯然失色\nST年代~是妳潛藏在記憶深處的..青澀模樣~淺淺的微笑..帶來寄情湖畔的思念\n艷陽高照的沙灘~是妳嫵媚氣息的呼吸..閃耀星沙呼喊 陽光~沙灘~朵兒\n秋風颯颯~幽思懷古之情油然而生..還記得~那些年......我為妳留下的美麗詩篇嗎\n蘊念真實的流露..是妳若干年後的瑰寶~那發酵的成熟韻味..極緻牙買加的響宴~在妳回眸不經意的瞬間.我記錄下了~史詩般的美麗\n秋末~轉入初冬的前奏..聆聽屬於妳的浪漫樂曲~是這時刻.最舒服的享受\n慵懶的美感~在妳舉手投足間..悄悄的散發出~飄絮般的輕柔..是妳髮稍動人的音符.又是一個年頭了~妳像歲月之外的存在般. 依然~美麗動人的......讓人~微醺",
    "今天的清晨.摻雜了昨夜的幸福.淺淺的遺憾..讓眼睛不自覺的哀傷了起來~眼睛它累了.流了點汗..耳朵說它跳針了.相同的旋律在腦中盤旋.而我......感覺到了.伴隨我多年的這些.是上帝賦予詩人的浪漫.在筆下流露的情感..在生命的高牆上添增的淡淡藍色.是勇敢.大方..也有著一抹弦月的失落~享受與眾不同的起伏情緒..譜寫獨特的生命樂曲..我是生命的藝術家.用屬於自己的節奏.彈奏給一同在時代洪流的夥伴們....一段相遇與牽手的故事.僅管不見得會找到她~但..好難得的..........遇見了你(妳)們",
    "刺蝟豎起背上的刺.是為了保護那比任何更為脆弱的腹部......赤裸的自己.沒有非得不可的擔子.也不再擁有脆弱....不害怕恐懼的方法.就是成為恐懼本身\n或許妳一點都沒投入.所以不能理解在那件事情發生時.妳又離去時那種加劇的強烈.瓦解的不是情感..是自信.再也無法相信自己的那份自信....\n沒有了自信心..卻也無能為力~一點都不如妳們看到的樂觀.沒有人願意癱著過了這歲月.漫漫的未來如無期徒刑般的折騰著.如何面對自己是個功課.又該如何面對它人又是個功課..黑暗已經盤據在心深處.恐懼則是揮之不去的夢靨.身上背的字字血淚.早已刻蝕入骨.如附骨之蛆般的如影隨形..過不去的.是歲月在身上留下的足跡~以及意外無情炙燙過的傷痕",
    "優雅成熟的美感，牽引了靈魂的企盼；一顰一笑的嫵媚，鼓動了熱血的激昂；沸騰的青春之旅，奔馳在血脈之中，妳是獨特的，是唯一無二的。風，因妳停佇了腳步；月，因妳而失去了輝華；黯然失色的紫羅蘭，掀開了潘朵拉之盒，責難著屬於妳的美；洛神賦筆下的她，因妳而自慚形穢；而我，服膺在妳美貌之中、石榴裙下，不離不棄、至死不渝。～傳說於柏拉圖世界的戀，我成了妳最真實的俘虜～生日快樂",
    "你們娶了..妳們嫁了....\n我好似落下了......\n在風中追逐飄零的葉子.在霧中找尋失落的影子..\n憐憫是種無謂的施捨......在愛的話語裡\n我譜寫一個人的故事.我奏起一個人的樂章..\n無名指的孤獨突顯生命歲月的寂療......\n我想得多了..自古多情空餘恨\n我不聰明..智慧顯得離我太遠\n上帝......一切都給祢了\n在我靈魂未被撒旦征服前~", "浮動的心.在鼓躁著..\n第三場惡耗..在以為黑色星期五結束時\n......被開啟\n繼二叔.老師..這次......是他了\n他曾笑著說......\n咱們這種人就別害人了.結婚!?\n跟我是扯不上關係的..\n......的確.他是個遊戲人間的浪子\n放縱人間的浪子..\n愛好自由.在他眼中人生顯得很簡單......\n家人擔心他.但.終歸也該放下心了..\n一場意外的工觴..他離開了.在他喜歡的地方\n他曾說他最愛去工地......\n享受工作完小酌的歡樂..我總是笑了笑\n大表哥.你離開了..\n僅管了解你對這世界原本就沒有多大留戀~\n但是.我們都有相同的一份責任......\n或許你玩夠了..我像風一樣的老哥\n再見了......我還是想問你\n哥..你的放逐......也是在逃避些什麼嗎!?", "那晚....空心木頭出現時..\n我瞧見了一個身影.閃進了房門\n阿姨一直讓自己很忙碌的......試圖淡忘些什麼\n中午時..她一直訴說著大表哥不聽話的過去 ..\n我知道我不能哭..僅管我了解了阿姨的思念......\n阿姨再傳統不過了....一輩子為家庭無怨無悔付出的她\n刀子嘴豆腐心.更是再傳統不過了......我卻懂得\n我這阿姨她訴說著感情的一切......在房裡的她\n不是個會窩在房裡的她~我懂得\n她害怕那個來帶走她兒子的空心木頭......\n....那個讓她空了心的木頭棺木\n我想.我或許是個愛哭鬼!", "姨丈呢!?他很堅定......\n一個好兒子.好丈夫.好爸爸..顯示出他的鎮定\n只是......姨丈多喝了些酒.喝過酒的我\n卻看出了姨丈在這晚想掩蓋的一切......\n他想醉一場..在姨丈刻意的迴避大表哥相片的那刻\n我感受到他在心底的那份隱忍..那份痛楚\n直到......在化給大表哥我們最後的心意時\n姨丈..他出現在一個不起眼的角落\n雙手緊握.深怕漏了什麼..深怕他遠方的兒子收不到了什麼\n到了最後.他轉身離開......我知道.姨丈的腳步\n每一步的沉重.都不是我們的理解的負荷..\n我想.我真的是個愛哭鬼吧!!", "一早的我.趕著送大表哥入殮......\n大表哥的事.是不能讓這兩個老人家再操心的..\n我卻還是看見了......\n在轉角門邊.有個身影..有個想見不敢見的身影\n偷偷的落淚..其實.阿姨沒有那麼堅強......\n....在她自以為沒事的跟我對大表哥的事..聊個不停時\n我......又一次想狠狠的陪著阿姨哭個一場..", "終於.大表哥要告別長輩了......\n親家公走了出來..那個大表哥100歲的親爺爺\n姨丈他.自然的讓我們覺得一點都不自然..\n我想..姨丈知道.他不可以讓100歲的老爸......\n......再更感到悲傷了\n但..告別的那刻....................\n阿姨..阿姨的淚還是決堤了......她38年含莘茹苦的兒子..\n我們這些兄弟姊妹.很堅強的保持了應該有的莊嚴氣息......\n雖然..眼涙還是不爭氣的流下了.我們..\n只是默默的轉頭拭去......我知道.大家想得都一樣\n我們要堅強的支撐起一切......這.就是人生.就是未來\n100歲的親家公..淡淡的說了聲.他去修行了......\n在親家公的那個年代.我懂得......\n大表哥對他的重要.那年代..的那份重視\n我們猜想著......大表哥的成家立業\n是不是他老人家在等待的最後一件事!?", "眺望~挑旺\n清晨.在沉悶的空氣中甦醒......梳洗完沉靜了下心靈~翻起了書\n依稀聽見了窗外夾雜的細碎聲響..打開了窗~一道光映入了眼簾\n沉重的空氣依舊沉悶著.原以為開了窗會有轉變的我....誤會了\n上帝的恩賜廣澤萬民.不獨厚一人......愛不會硬生生的流進停止的空間\n於是..我打開了房間的另一扇門.屬於這空間的心門~\n氛圍開始變化了..從時間靜止的空間中脫離.空氣們活躍了起來\n腦中響起上帝靈裡的活泉..僅管還想念著難忘的她.祂卻漸漸撫慰了我\n我祈禱著.上帝聽見了......從眼進入了我的思想.卻在心門敲啊敲\n~孩子啊!我來了.這門!?\n焦急的我.失了聲的嘶吼著..鑰匙呢!?鑰匙呢!?我的鑰匙哪..\n我的記憶.為了保護而藏匿了許多片段..那些撕裂無數夜晚的記憶碎片\n那些分不清是現實與夢境的過去~盤根錯結地糾結在靈魂的空隙中\n別人口中的故事成了自己的悲劇..倚著上帝.殘破佝僂的身得以苟存\n其實我已經可以漸漸的站著了..但還止不住眼中流下的汗水~\n失憶.原來是最後的奢侈....\n但.生命是場敬拜.必要成就美好.獻給上帝..我因信而等候神\n轉化我過去所有的一切.理解上帝的真意......成就我最真實的樣貌\n~上帝不忍祂的孩子跌倒受傷.除了為成就孩子在祂裡最真實的樣貌..", "序\n睽違多時，35年的時間不長，卻也說不上多短，我最親愛的老爹與媽咪，終於在這時間拍了一組屬於她們的婚紗照，當然我們，也少不了運用這個機會，留下了我們的身影，於是，屬於我們的家庭照，也因應而生。\n從前從前從前，回朔到35年前；那年，草草的在家門口拍了一張不算婚紗照的婚紗照，沒多久我出世了，爹爹當兵了，典當了一只結婚戒指的小家庭，在退伍後展開了新生活，一路喜怒哀樂地扶持至今，記憶裡剩下的，是家人的微笑，生命中的歡樂苦痛，都是為了展開微笑而存在；很高興的，我們一直重視著彼此，而這份屬於家人的禮物，則成為了這35年紀錄的獻禮，我愛你們，正如你們愛我，親愛的老爹與媽咪~父親節禮物，獻給父親，也獻給我所有的家人。\n2014/8/8 By 志源&冠瑋&依琳\n未完待續......", "想念外婆的小孩們\n十幾個小孩，在廚房與曬著鹹菜的廳堂之間跑來跑去，笑聲、腳步聲交錯著，等著阿嬤炸雞塊。\n那時候的我們，總覺得時間很長..\n聽著阿公說起日據時代的故事，那些曾經發生在他生命裡的真實，在年幼的我們耳裡，像是一段段遙遠的故事。看著阿嬤在廚房裡忙進忙出，端菜、炸雞塊、張羅著一大家子的忙碌，也從來沒有想過——就在那些尋常的日子裡，我們正一點一點長大，而阿公阿嬤，也一點一點老去了......\n後來，小孩們長大了。\n各自忙著工作、家庭，忙著生活裡大大小小的瑣事。偶爾抽空回去陪陪阿公阿嬤，總以為下一次還會有時間，明天還可以再回來，下一個節日還能再一起吃飯。\n我們以為，時間會一直在那裡等著我們..\n直到有一天，阿公阿嬤一個接著一個，先停下了腳步；那一刻才明白，原來時間從來沒有多給我們任何特權，它對每一個人都是公平的；也是從那時候開始，我們突然懂得了很多以前不懂的事——愛要及時說，想念要及時表達，想抱的人，就要立刻抱緊。因為有些「下次」，真的不一定還會有。\n十幾個小孩，如今都已經長大了；偶爾聚在一起，還是會念著當年阿嬤炸的雞塊，說著誰偷偷跑去吃曬好的鹹菜，笑著回憶那些曾經以為平凡、如今卻再也回不去的日子。\n笑著笑著，眼眶會紅；那些沒有說出口的想念，早已安安靜靜地藏在每個人的心裡，我們還是那十幾個小孩，只是再也等不到阿嬤喊我們吃雞塊，也再也聽不到阿公說那些故事。原來，長大不是學會了多少事情，而是終於明白——有些人離開以後，童年也就跟著少了一個可以回去的地方。\n想念外婆的小孩們，依然記得那一盤炸雞塊，也依然記得，那個有阿公、有阿嬤、有十幾個孩子奔跑嬉鬧的家，那是我們的童年，也是我們這一生，再也回不去，卻永遠最想回去的地方。"

function getFormattedTimestamp() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
}

function initDataStructure(raw) {
  const structured = {};
  const defaultTime = getFormattedTimestamp();
  for (let cat in raw) {
    structured[cat] = raw[cat].map(item => {
      if (typeof item === 'string') {
        return { text: item, updated_at: defaultTime };
      }
      return item;
    });
  }
  return structured;
}

let initialDataset = initDataStructure(rawDataset);
let currentTab = 'ALL';
let notesData = JSON.parse(localStorage.getItem('user_notes_data_v5'));

if (!notesData) {
  notesData = initialDataset;
}

function renderTabs() {
  const tabsContainer = document.getElementById('categoryTabs');
  tabsContainer.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = `tab-btn ${currentTab === 'ALL' ? 'active' : ''}`;
  allBtn.innerText = '全部創作';
  allBtn.onclick = () => switchTab('ALL');
  tabsContainer.appendChild(allBtn);

  for (let cat in notesData) {
    const btn = document.createElement('button');
    btn.className = `tab-btn ${currentTab === cat ? 'active' : ''}`;
    btn.innerText = cat;
    btn.onclick = () => switchTab(cat);
    tabsContainer.appendChild(btn);
  }
}

function renderNotes() {
  renderTabs();

  const container = document.getElementById('notesContainer');
  container.innerHTML = '';

  const categories = currentTab === 'ALL' ? Object.keys(notesData) : [currentTab];

  categories.forEach(cat => {
    if (!notesData[cat]) return;
    const section = document.createElement('section');
    section.style.marginBottom = '40px';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <h2 class="section-title">
        【${escapeHtml(cat)}】
        <div class="category-ops">
          <button class="cat-op-btn" title="編輯分類名稱" onclick="renameCategory('${escapeJsString(cat)}')">✏️ 重新命名</button>
          <button class="cat-op-btn" title="刪除此分類" onclick="deleteCategory('${escapeJsString(cat)}')">🗑️ 刪除分類</button>
        </div>
      </h2>
      <span style="font-size:0.9rem; color:var(--text-secondary);">共 ${notesData[cat].length} 則便簽</span>
    `;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'grid';

    notesData[cat].forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'note-card';
      card.id = `card-${cat}-${index}`;

      card.innerHTML = `
        <div class="card-header">
          <span class="card-index">便簽 #${index + 1}</span>
          <div class="card-actions">
            <button class="mini-btn" id="edit-btn-${cat}-${index}" onclick="enableEdit('${escapeJsString(cat)}', ${index})">✏️ 編輯</button>
            <button class="mini-btn mini-btn-save" id="save-btn-${cat}-${index}" onclick="saveSingleCard('${escapeJsString(cat)}', ${index})">💾 儲存</button>
            <button class="mini-btn" title="刪除便簽" onclick="deleteCard('${escapeJsString(cat)}', ${index})">🗑️ 刪除</button>
          </div>
        </div>
        <div class="note-content" id="content-${cat}-${index}" contenteditable="false">${escapeHtml(item.text)}</div>
        <div class="card-footer">
          <span class="card-timestamp" id="time-${cat}-${index}">最後保存：${item.updated_at || '無紀錄'}</span>
          <div class="seal-mark">藏</div>
        </div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function escapeJsString(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function enableEdit(cat, index) {
  const contentEl = document.getElementById(`content-${cat}-${index}`);
  if (contentEl) {
    contentEl.contentEditable = "true";
    contentEl.classList.add("editing");
    contentEl.focus();
    showStatus(`正在編輯【${cat}】便簽 #${index + 1}`);
  }
}

function saveSingleCard(cat, index) {
  const contentEl = document.getElementById(`content-${cat}-${index}`);
  if (!contentEl) return;
  contentEl.contentEditable = "false";
  contentEl.classList.remove("editing");

  const newText = contentEl.innerText.trim();
  const nowTimestamp = getFormattedTimestamp();

  notesData[cat][index].text = newText;
  notesData[cat][index].updated_at = nowTimestamp;

  localStorage.setItem('user_notes_data_v5', JSON.stringify(notesData));

  const timeEl = document.getElementById(`time-${cat}-${index}`);
  if (timeEl) {
    timeEl.innerText = `最後保存：${nowTimestamp}`;
  }

  showStatus(`便簽 #${index + 1} 已成功儲存！`);
}

function switchTab(tab) {
  currentTab = tab;
  renderNotes();
}

function addNewCategory() {
  const newCatName = prompt("請輸入新分類名稱：");
  if (newCatName && newCatName.trim()) {
    const trimmed = newCatName.trim();
    if (notesData[trimmed]) {
      alert("該分類名稱已存在！");
      return;
    }
    notesData[trimmed] = [];
    localStorage.setItem('user_notes_data_v5', JSON.stringify(notesData));
    currentTab = trimmed;
    renderNotes();
    showStatus(`已成功增加分類【${trimmed}】`);
  }
}

function renameCategory(oldCat) {
  const newCatName = prompt(`請輸入【${oldCat}】的新分類名稱：`, oldCat);
  if (newCatName && newCatName.trim() && newCatName.trim() !== oldCat) {
    const trimmed = newCatName.trim();
    if (notesData[trimmed]) {
      alert("該分類名稱已存在！");
      return;
    }
    notesData[trimmed] = notesData[oldCat];
    delete notesData[oldCat];
    if (currentTab === oldCat) {
      currentTab = trimmed;
    }
    localStorage.setItem('user_notes_data_v5', JSON.stringify(notesData));
    renderNotes();
    showStatus(`已將分類【${oldCat}】更名為【${trimmed}】`);
  }
}

function deleteCategory(cat) {
  if (confirm(`確定要刪除分類【${cat}】及其包含的所有便簽嗎？`)) {
    delete notesData[cat];
    if (currentTab === cat) {
      currentTab = 'ALL';
    }
    localStorage.setItem('user_notes_data_v5', JSON.stringify(notesData));
    renderNotes();
    showStatus(`已刪除分類【${cat}】`);
  }
}

function addNewCard() {
  const availableCats = Object.keys(notesData);
  if (availableCats.length === 0) {
    alert("請先增加至少一個分類！");
    return;
  }
  const targetCat = currentTab === 'ALL' ? availableCats[0] : currentTab;
  const nowTimestamp = getFormattedTimestamp();
  notesData[targetCat].unshift({
    text: "點擊『編輯』開始撰寫內容...",
    updated_at: nowTimestamp
  });
  localStorage.setItem('user_notes_data_v5', JSON.stringify(notesData));
  renderNotes();
  enableEdit(targetCat, 0);
  showStatus("已新增新便簽");
}

function deleteCard(cat, index) {
  if (confirm("確定要刪除這張便簽嗎？")) {
    notesData[cat].splice(index, 1);
    localStorage.setItem('user_notes_data_v5', JSON.stringify(notesData));
    renderNotes();
    showStatus("便簽已刪除");
  }
}

function resetData() {
  if (confirm("確定要還原為重構後的四大類初始數據嗎？之前的修改與新增分類將被重置。")) {
    notesData = initDataStructure(rawDataset);
    localStorage.removeItem('user_notes_data_v5');
    currentTab = 'ALL';
    renderNotes();
    showStatus("已還原至四大類初始狀態");
  }
}

function showStatus(msg) {
  const el = document.getElementById('statusMsg');
  el.innerText = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

renderNotes();
</script>
