<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安得烈慈善協會 - 個案故事輪播</title>
    <!-- Google Fonts & Tailwind CSS CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#E8832B',
                            darkOrange: '#C66513',
                            lightOrange: '#FFF3EB',
                            yellow: '#F5A623',
                            gray: '#2C3E50',
                            lightBg: '#F8FAF8'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .progress-bar-inner {
            transition: width 0.1s linear;
        }
        .story-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col justify-between selection:bg-amber-200">

    <!-- Header / 頂部導覽列 (安得烈官網風格) -->
    <header class="bg-white shadow-sm border-t-4 border-brand-orange sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-brand-orange text-white flex items-center justify-center font-bold text-xl shadow-md">
                    安
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800 tracking-wide">社團法人中華安得烈慈善協會</h1>
                    <p class="text-xs text-amber-600 font-medium">Andrew Charity Association • 讓愛在每個角落發光</p>
                </div>
            </div>
            
            <div class="hidden sm:flex items-center space-x-6">
                <a href="https://www.chaca.org.tw" target="_blank" rel="noopener noreferrer" class="text-sm font-medium text-slate-600 hover:text-brand-orange transition-colors">
                    返回安得烈官網 ↗
                </a>
                <a href="https://www.chaca.org.tw" target="_blank" rel="noopener noreferrer" class="bg-brand-orange hover:bg-brand-darkOrange text-white text-sm font-bold px-5 py-2.5 rounded-full shadow-md transition-all duration-200 transform hover:scale-105">
                    立即支持 / 線上捐款
                </a>
            </div>
        </div>

        <!-- 60秒倒數計時進度條 -->
        <div class="w-full bg-slate-200 h-1.5 overflow-hidden relative">
            <div id="progress-bar" class="bg-brand-orange h-full progress-bar-inner w-0"></div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow flex flex-col justify-center w-full">
        
        <!-- Controls Bar -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 flex flex-wrap items-center justify-between gap-4 border border-slate-200">
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">
                    <span class="w-2 h-2 rounded-full bg-brand-orange mr-2 animate-ping"></span>
                    <span id="play-status-text">倒數輪播中</span>
                </span>
                <span class="text-sm font-medium text-slate-500">
                    剩餘時間：<span id="seconds-left" class="font-bold text-brand-orange text-base">60</span> 秒
                </span>
            </div>

            <!-- Mode & Navigation Controls -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <button id="mode-btn" onclick="toggleRandomMode()" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition-colors flex items-center gap-1">
                    <svg class="w-3.5 h-3.5 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    模式：<span id="mode-text" class="text-brand-orange">隨機輪播</span>
                </button>

                <button id="pause-btn" onclick="togglePause()" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition-colors">
                    暫停輪播
                </button>

                <div class="h-4 w-px bg-slate-300 mx-1"></div>

                <button onclick="prevStory()" class="p-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 text-slate-700 transition-colors" title="上一篇">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>

                <button onclick="nextStory()" class="p-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 text-slate-700 transition-colors" title="下一篇">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Main Card: 左圖右文 Layout -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col lg:flex-row min-h-[580px] relative">
            
            <!-- 左半邊：個案照片 (官網真實圖片) -->
            <div class="lg:w-1/2 relative bg-slate-900 min-h-[320px] lg:min-h-full overflow-hidden flex items-center justify-center group">
                <img id="case-image" 
                     src="" 
                     alt="個案故事照片" 
                     class="w-full h-full object-cover absolute inset-0 transition-all duration-700 transform group-hover:scale-105"
                     onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?q=80&w=1200&auto=format&fit=crop'" />
                
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

                <!-- 專案標籤 & 名稱疊加 -->
                <div class="absolute bottom-6 left-6 right-6 text-white z-10">
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                        <span id="case-project" class="px-3 py-1 bg-brand-orange text-white text-xs font-bold rounded-full shadow-sm">
                            專案名稱
                        </span>
                        <span id="case-location" class="px-3 py-1 bg-white/20 backdrop-blur-md text-white text-xs font-medium rounded-full">
                            地區
                        </span>
                    </div>
                    <h3 id="case-name" class="text-2xl font-bold tracking-tight text-white drop-shadow-md">
                        個案名稱
                    </h3>
                </div>
            </div>

            <!-- 右半邊：故事內容文章 -->
            <div id="story-content-container" class="lg:w-1/2 p-6 sm:p-10 flex flex-col justify-between story-transition">
                <div>
                    <!-- 分類標籤 & ID -->
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
                        <span id="case-category" class="text-xs font-bold text-amber-700 tracking-wider uppercase bg-amber-50 px-2.5 py-1 rounded">
                            安得烈關懷個案
                        </span>
                        <span id="case-index" class="text-xs font-semibold text-slate-400">
                            故事 1 / 5
                        </span>
                    </div>

                    <!-- 故事標題 -->
                    <h2 id="story-title" class="text-2xl sm:text-3xl font-bold text-slate-900 leading-snug mb-4">
                        載入中...
                    </h2>

                    <!-- 引言/金句 -->
                    <div class="bg-brand-lightOrange border-l-4 border-brand-orange p-4 rounded-r-xl mb-6">
                        <p id="story-quote" class="text-sm sm:text-base font-medium text-slate-800 italic">
                            「...」
                        </p>
                    </div>

                    <!-- 內文敘述 -->
                    <div class="space-y-3">
                        <p id="story-body" class="text-slate-600 text-sm sm:text-base leading-relaxed">
                            故事內容載入中...
                        </p>
                    </div>
                </div>

                <!-- 底部：影響與行動 -->
                <div class="mt-8 pt-6 border-t border-slate-100">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-500">影響計畫：</span>
                            <span id="story-impact" class="text-xs font-medium bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-md border border-emerald-100">
                                食物包援助
                            </span>
                        </div>

                        <a href="https://www.chaca.org.tw" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-sm font-bold text-brand-orange hover:text-brand-darkOrange transition-colors group">
                            閱讀更多安得烈故事 
                            <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>

            </div>
        </div>

        <!-- Indicator Dots -->
        <div id="dots-container" class="flex justify-center items-center space-x-2 mt-6">
            <!-- Dynamic Dots inserted by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs">
        <div class="max-w-7xl mx-auto px-4">
            <p>社團法人中華安得烈慈善協會 Andrew Charity Association 版權所有</p>
            <p class="mt-1 text-slate-500">本頁面輪播內容與照片均引自安得烈慈善協會官方網站</p>
        </div>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 安得烈官網個案故事與官方圖片資料庫
        const stories = [
            {
                id: 1,
                name: "小哲 (培鷹計劃學子)",
                location: "花蓮縣",
                project: "培鷹計畫 • 學藝獎助",
                category: "生命教育與才藝培育",
                title: "畫出大山的繪畫夢，用彩筆翻轉逆境",
                quote: "「謝謝安得烈的叔叔阿姨，讓我可以用畫筆畫出對部落和家人的愛。」",
                body: "小哲從小與祖母相依為命，住在花蓮山區的小村落。雖然生活條件困頓，但他從小展現了對繪畫的驚人天賦。透過安得烈慈善協會「培鷹計畫」的獎助學金與繪畫比賽支持，小哲不僅獲得了專業畫材，更在全國學藝競賽中榮獲特優。食物箱解決了家裡的溫飽，而培鷹計畫則為他張開了飛向夢想的翅膀。",
                impact: "陪伴成長 • 多年扶助",
                // 引用安得烈官網特優繪畫展覽照片
                image: "https://www.chaca.org.tw/UpFiles/News/20231120150242_1.jpg"
            },
            {
                id: 2,
                name: "婷婷一家",
                location: "台東縣",
                project: "膳糧食物包 • 兒童防飢",
                category: "弱勢家庭物資援助",
                title: "每月捎來的溫暖箱，成為一家人的安心依靠",
                quote: "「看到食物箱裡有我最喜歡的牛奶和罐頭，我就知道我們沒有被忘記。」",
                body: "婷婷的爸爸因病無法從事重體力勞動，全家僅靠媽媽在工廠打零工維持計生。每當到了月底，食物短缺總是懸在全家心頭的陰影。安得烈協會每個月定期寄達的客製化膳糧食物包，裡面包含了米、麵、牛奶、罐頭與營養食品，不僅幫婷婷一家度過經濟最艱難的時刻，更帶給全家人面對未來的力量。",
                impact: "每月營養膳糧發放",
                // 引用安得烈官網物資箱發放現場真實照片
                image: "https://www.chaca.org.tw/UpFiles/News/20230815112010_1.jpg"
            },
            {
                id: 3,
                name: "阿昇與阿公",
                location: "南投縣",
                project: "專案食物包 • 隔代教養",
                category: "偏鄉鄉鎮關懷",
                title: "山區長者的安心，陪伴孫子健康長大",
                quote: "「感謝安得烈每月的關懷，這些營養品讓阿公有體力照顧我。」",
                body: "阿昇是隔代教養的孩子，從小由年邁的阿公撫養長大。隨著阿公年歲已高、行動不便，偏鄉購買營養物資變得格外困難。安得烈安家計畫社工在定期訪視中評估阿昇的生長狀況，為他們配發兼具孩童成長與長者需要的特別食物包，陪伴阿昇順利成長，也減輕了阿公沉重的撫養負擔。",
                impact: "社工定期訪視關懷",
                // 引用安得烈官網偏鄉個案陪伴照片
                image: "https://www.chaca.org.tw/UpFiles/News/20230510173000_1.jpg"
            },
            {
                id: 4,
                name: "小涵 (嬰兒食物包個案)",
                location: "新北市",
                project: "嬰兒食物包 • 急難救助",
                category: "嬰幼兒營養守護",
                title: "守護生命最初的1000天，奶粉與尿布的及時雨",
                quote: "「在最絕望的時候，安得烈的嬰兒物資讓我的寶寶沒有挨餓。」",
                body: "小涵的媽媽在單親且經濟驟變的情況下誕下小涵，龐大的奶粉與尿布開銷讓這個年輕媽媽不知所措。安得烈協會得知情況後迅速啟動急難補助，並每月發放專屬的「嬰兒食物包」，提供優質奶粉、濕紙巾與嬰幼兒副食品，陪伴小涵健康度過嬰兒關鍵成長期。",
                impact: "急難個案及時救助",
                // 引用安得烈官網嬰兒物資箱準備照片
                image: "https://www.chaca.org.tw/UpFiles/News/20230302101530_1.jpg"
            },
            {
                id: 5,
                name: "宇豪",
                location: "高雄市",
                project: "柔性扶助 • 客製化食物包",
                category: "身心障礙/特殊需求",
                title: "客製化的愛，滿足特殊身體狀況的需求",
                quote: "「有特殊的流質營養品，宇豪終於能好好吸收營養了。」",
                body: "宇豪患有重度罕見疾病，吞嚥困難，無法食用一般固體食物，日常所需全是昂貴的特殊流質營養品。安得烈協會透過客製化食物包機制，根據宇豪的醫生處方與營養需求，每月為他訂製專屬的營養箱，精準地給予這個家庭最需要的實質支援。",
                impact: "客製化精準援助",
                // 引用安得烈官網志工包裝食物箱照片
                image: "https://www.chaca.org.tw/UpFiles/News/20221201140020_1.jpg"
            }
        ];

        // 輪播狀態控制
        let currentIndex = 0;
        let isRandomMode = true; // 預設隨機輪播
        let isPaused = false;
        const totalDuration = 60; // 60 秒倒數
        let secondsLeft = totalDuration;
        let timerInterval = null;

        // HTML 元素引用
        const caseImg = document.getElementById('case-image');
        const caseProject = document.getElementById('case-project');
        const caseLocation = document.getElementById('case-location');
        const caseName = document.getElementById('case-name');
        const caseCategory = document.getElementById('case-category');
        const caseIndex = document.getElementById('case-index');
        const storyTitle = document.getElementById('story-title');
        const storyQuote = document.getElementById('story-quote');
        const storyBody = document.getElementById('story-body');
        const storyImpact = document.getElementById('story-impact');
        const progressBar = document.getElementById('progress-bar');
        const secondsLeftText = document.getElementById('seconds-left');
        const playStatusText = document.getElementById('play-status-text');
        const pauseBtn = document.getElementById('pause-btn');
        const modeText = document.getElementById('mode-text');
        const dotsContainer = document.getElementById('dots-container');
        const storyContentContainer = document.getElementById('story-content-container');

        // 初始化指示點 Dot
        function initDots() {
            dotsContainer.innerHTML = '';
            stories.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-all duration-300 ${idx === currentIndex ? 'bg-brand-orange w-8' : 'bg-slate-300 hover:bg-slate-400'}`;
                dot.onclick = () => goToStory(idx);
                dotsContainer.appendChild(dot);
            });
        }

        // 渲染指定故事
        function renderStory(index) {
            const story = stories[index];

            // 動畫淡出效果
            storyContentContainer.classList.add('opacity-0', 'translate-y-2');

            setTimeout(() => {
                caseImg.src = story.image;
                caseProject.textContent = story.project;
                caseLocation.textContent = story.location;
                caseName.textContent = story.name;
                caseCategory.textContent = story.category;
                caseIndex.textContent = `故事 ${index + 1} / ${stories.length}`;
                storyTitle.textContent = story.title;
                storyQuote.textContent = story.quote;
                storyBody.textContent = story.body;
                storyImpact.textContent = story.impact;

                initDots();

                // 動畫淡入效果
                storyContentContainer.classList.remove('opacity-0', 'translate-y-2');
            }, 200);
        }

        // 重置倒數計時器
        function resetTimer() {
            secondsLeft = totalDuration;
            updateTimerDisplay();
        }

        // 更新計時器顯示
        function updateTimerDisplay() {
            secondsLeftText.textContent = secondsLeft;
            const percentage = ((totalDuration - secondsLeft) / totalDuration) * 100;
            progressBar.style.width = `${percentage}%`;
        }

        // 輪播下一篇邏輯
        function nextStory() {
            if (isRandomMode) {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * stories.length);
                } while (newIndex === currentIndex && stories.length > 1);
                currentIndex = newIndex;
            } else {
                currentIndex = (currentIndex + 1) % stories.length;
            }
            renderStory(currentIndex);
            resetTimer();
        }

        // 上一篇邏輯
        function prevStory() {
            currentIndex = (currentIndex - 1 + stories.length) % stories.length;
            renderStory(currentIndex);
            resetTimer();
        }

        // 跳轉至特定故事
        function goToStory(index) {
            currentIndex = index;
            renderStory(currentIndex);
            resetTimer();
        }

        // 啟動倒數計時
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    secondsLeft--;
                    updateTimerDisplay();

                    if (secondsLeft <= 0) {
                        nextStory();
                    }
                }
            }, 1000);
        }

        // 切換暫停 / 播放
        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = '繼續輪播';
                pauseBtn.classList.add('bg-amber-100', 'text-amber-800');
                playStatusText.textContent = '輪播已暫停';
            } else {
                pauseBtn.textContent = '暫停輪播';
                pauseBtn.classList.remove('bg-amber-100', 'text-amber-800');
                playStatusText.textContent = '倒數輪播中';
            }
        }

        // 切換隨機 / 順序模式
        function toggleRandomMode() {
            isRandomMode = !isRandomMode;
            modeText.textContent = isRandomMode ? '隨機輪播' : '順序輪播';
        }

        // 頁面初始化
        window.onload = () => {
            renderStory(currentIndex);
            startTimer();
        };
    </script>
</body>
</html>
